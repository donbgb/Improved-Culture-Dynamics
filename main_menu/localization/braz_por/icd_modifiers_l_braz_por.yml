 azeri_culture_movement: "Azerificação dos Adhari"
 azeri_culture_movement_desc: "A migração dos turcos para o Cáucaso causou uma grande transformação da cultura adhari. Os adhari cada vez mais abandonam sua língua pela língua turca azeri e adotam costumes turcos. Todos a população adhari sob governos turcos ou mongois, ou sobre um governo que não os aceita culturamente mas aceita os azeri, vai se transformar em azeri com o tempo."
 azeri_culture_movement_location_modifier: "Azeri Culture Movement Location Modifier"
 dutch_culture_movement: "Convergência Neerlandês"
 dutch_culture_movement_desc: "A criação dos Países Baixos vai levar a formação de uma cultura política distinta. A cultura principal dos estados que fundem os Países Baixos vai adotar essa identidade primeiro, seguido por outras culturas também dos Países. Uma vez que a formação dessa identidade comece, culturas relacionadas que fiquem fora dos Países Baixos não vão adotar essa identitidade com facilidade."
 dutch_culture_movement_location_modifier: "Dutch Culture Movement Location Modifier"
 lithuanian_culture_movement: "Etnogênese Lituana"
 lithuanian_culture_movement_desc: "O ducado da Lituânia trouxe união para os povos aukstaitianos e samogícios. Uma nova identidade e cultura vai formar entre eles uma vez que o estado comece o processo de integração cultural."
 lithuanian_culture_movement_location_modifier: "Lithuanian Culture Movement Location Modifier"
 russian_culture_movement: "Etnogênese Russa"
 russian_culture_movement_desc: "A união das terras de Rus trouxe também a união de dialetos distintos eslavos sobre uma identidade russa maior. A nova identidade e cultura vai formar enter os eslavos orientais que são aceitos pelo estado russo, mas vai excluir povos que não foram integrados sobre a autoridade russa."
 russian_culture_movement_location_modifier: "Russian Culture Movement Location Modifier"
 ruthenian_culture_movement: "Etnogênese Ruteno"
 ruthenian_culture_movement_desc: "A criação de uma Rutênia unida trouxe também a união de dialetos distintos eslavos sobre uma identidade russa maior. A nova identidade e cultura vai formar enter os eslavos orientais que são aceitos pelo estado russo, mas vai excluir povos que não foram integrados sobre a autoridade russa."
 ruthenian_culture_movement_location_modifier: "Ruthenian Culture Movement Location Modifier"
 
 turkification_culture_movement: "Turquificação dos Mongois"
 turkification_culture_movement_desc: "The intermixing of Turkish and Mongol culture has led to the formation of a distinct Turco-Mongol identity. Over time, Mongols that are not governed by a Mongol government that can defend their interests, will adopt the Turkish language and a Turkic identity." 
 turkification_culture_movement_location_modifier: "Turkification of Mongols Location Modifier"
 turkification_culture_movement_tt: "Turquificação dos Mongois ainda não começou."
 
 
 
