l_english:
 game_concept_voluntary_conversions: "Voluntary Conversions"
 game_concept_voluntary_conversion: "Voluntary Conversion"
 game_concept_voluntary_conversion_desc: "Voluntary conversion is a form of [conversion|e] that occurs due to the initiative of individuals. This occurs when individuals choose to join a new religious community due to personal spiritual, economic or social concerns.\n\nVoluntary conversions are calculated in-game every four years. They are typically small in numbers but are not usually restricted by [control|e] (though they do not happen in [locations|e] with under 10 control or [conquered|e] locations). Conversion rate increases with [pop_satisfaction|e], [tolerance|e], and [ShowEstateTypeName('dhimmi_estate')] privileges. See the #T $mapmode_icd_voluntary_conversion_map_name$ Map#!."
 game_concept_forced_conversion: "Forced Conversion"
 game_concept_forced_conversions: "Forced Conversions"
 game_concept_forced_conversion_desc: "Forced conversion is a form of [conversion|e] imposed on the population, where they are coerced into abandoning their old religion and adhering to a new one. Forced conversion is not passive like other forms of conversion, instead it is calculated only for provinces affected by the Enforce Religious Conversion religious action. [protected_religions|e] cannot be forced to convert.\n\nForced conversions are calculated every year. The base value is dependent on a location's total population divided by 100, and it is modified by [ShowModifierTypeName('global_pop_conversion_speed_modifier')], [ShowModifierTypeName('local_pop_conversion_speed_modifier')] and [control|e].\nSubjects with a religion they would not normally have, either due to being [ShowSubjectTypeName('fiefdom')]s or having a religion enforced on them, will be hesitant to convert [pops|e] to that religion unless more than 10% of their population also adheres to it. See the #T $mapmode_icd_conversion_map_name$ Map#!."
 game_concept_communal_conversion: "Communal Conversion"
 game_concept_communal_conversions: "Communal Conversions"
 game_concept_communal_conversion_desc: "Communal conversion is a form of [conversion|e] that comes about due to cultural and religious shifts in an entire population group. These can occur if your [primary_culture|e] and cultural values are too tied to a particular religion for a minority faith to sustain itself, if a decentralised [ethnic_religion|e] is exposed to a more dominant religion or if slave conversion is enabled.\n\nCommunal conversions are calculated every year, with a rate of around 150 [pops|e] every year, modified by [ShowModifierTypeName('global_pop_conversion_speed_modifier')], [ShowModifierTypeName('local_pop_conversion_speed_modifier')] and [control|e]. The following are the major mechanics of communal conversion:\n\n  - If your [primary_culture|e] is dominated by a particular religion, pops of your [primary_culture|e] will convert to your religion (this can be triggered on if it isn't already using the Establish Confessional Community religious action).\n  - Pops that are slaves will convert if slave conversion is enabled.\n- Pops belonging to a [ethnic_religion|e] will always convert to their country's religion if it is not an [ethnic_religion|e]."
 game_concept_ethnic_religion: "Folk Religion"
 game_concept_ethnic_religions: "Folk Religions"
 game_concept_ethnic_religion_desc: "Folk religions are religions completely tied to a culture or cultures, that lack an organizational or theological structure that would permit them to thrive outside of this culture. These religions typically will only spread to their country's [primary_culture|e]. They are also vulnerable when a community is ruptured, and will struggle to sustain themselves if they are ruled by a proselytising country that does not possess a [ethnic_religion|e] itself."
 game_concept_protected_religion: "Protected Religion"
 game_concept_protected_religions: "Protected Religions"
 game_concept_protected_religion_desc: "Protected religions are religions protected from [forced_conversion|e]. Religions can be protected by specific [policies|e], being part of the [ShowEstateTypeName('dhimmi_estate')] or a country having high [heathenry_tolerance|e] or [heretic_tolerance|e]. High [heathenry_tolerance|e] or [heretic_tolerance|e] blocks conversion based on religion opinion:\n\nA religion viewed as #color_white Kindred#! is protected at or above -1.5 [tolerance|e]\nA religion viewed as #color_white Positive#! is protected at or above -0.5 [tolerance|e]\nA religion viewed as #color_white Neutral#! is protected at or above 0 [tolerance|e]\nA religion viewed as #color_white Negative#! is protected at or above 0.5 [tolerance|e]\nA religion viewed as #color_white Enemy#! is protected at or above 1.5 [tolerance|e]."
 game_concept_icd_forces: "Forces"
 game_concept_forcefully_converted: "Forcefully Converted"
