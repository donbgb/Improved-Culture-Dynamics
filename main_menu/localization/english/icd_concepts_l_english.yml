l_english:
 game_concept_voluntary_conversions: "Voluntary Conversions"
 game_concept_voluntary_conversion: "Voluntary Conversion"
 game_concept_voluntary_conversion_desc: "Voluntary conversion is a form of [conversion|e] that occurs due to the initiative of individuals. This occurs when individuals choose to join a new religious community due to personal spiritual, economic or social concerns.\n\nVoluntary conversions are calculated in-game every four years. They are calculated as percentages, and only happen to pops with [protected_religions|e]. These conversions do not happen in [locations|e] with under 10 control or that are [conquered|e]. Conversion rate increases with [pop_satisfaction|e], [tolerance|e], and [ShowEstateTypeName('dhimmi_estate')] privileges.\n\nTribesmen, Clerics and Slaves do not convert voluntarily.\n\nSee the #T $mapmode_icd_voluntary_conversion_map_name$ Map#! for values."
 game_concept_forced_conversion: "Forced Conversion"
 game_concept_forced_conversions: "Forced Conversions"
 game_concept_forced_conversion_desc: "Forced conversion is a form of [conversion|e] imposed on the population, when they are coerced into abandoning their old religion and forced to join a new one. Forced conversion is not passive like other forms of conversion, instead it is calculated only for provinces affected by the Enforce Religious Conversion religious action.\n[protected_religions|e] cannot be forced to convert.\n\nForced conversions are calculated every year. The base value is dependent on a location's total population divided by 200, and it is modified by [ShowModifierTypeName('global_pop_conversion_speed_modifier')] and [ShowModifierTypeName('local_pop_conversion_speed_modifier')].\n\nForcing [pops|e] to convert is deeply upsetting to them and will cause their [pop_satisfaction|e] to drop to #color_red 0%#! (except Protestants and Catholics during the Reformation).\n\nSee the #T $mapmode_icd_conversion_map_name$ Map#! for values on how [forced_conversion|e] works."
 game_concept_communal_conversion: "Communal Conversion"
 game_concept_communal_conversions: "Communal Conversions"
 game_concept_communal_conversion_desc: "Communal conversion is a form of [conversion|e] that comes about due to cultural and religious shifts in an entire population group. These can occur if your [primary_culture|e] is too tied to a particular religion for a minority faith to sustain itself, if a [ethnic_religion|e] is undermined by a more dominant religion or if slave conversion is enabled for slaves.\n\nCommunal conversions are calculated every year, with a rate of around 150 [pops|e] converting in each location every year, modified by [ShowModifierTypeName('global_pop_conversion_speed_modifier')] and [ShowModifierTypeName('local_pop_conversion_speed_modifier')], though these modifiers are not taken into account if they are below 0. The following are the major mechanics of communal conversion:\n\n  - If your [primary_culture|e] is dominated by a particular religion, pops of your [primary_culture|e] will convert to your religion (this can be triggered on if it isn't already using the Establish Confessional Community religious action).\n  - Pops that are slaves will convert if slave conversion is enabled.\n  - Minorities belonging to a [ethnic_religion|e] will always convert to a non-[ethnic_religion|e] if they are ruled by it and if it is present in the same [location|e] as them (10% of the population)."
 game_concept_ethnic_religion: "Folk Religion"
 game_concept_ethnic_religions: "Folk Religions"
 game_concept_ethnic_religion_desc: "Folk religions are religions strongly intertwined with particular cultures. They lack an organizational or theological structure that would permit them to thrive outside of their original cultural framework. These religions typically will only spread to their country's [primary_culture|e]. They are also vulnerable when a community is ruptured, and will struggle to sustain themselves if they are ruled by a proselytising country that does not possess a [ethnic_religion|e] itself."
 game_concept_protected_religion: "Protected Religion"
 game_concept_protected_religions: "Protected Religions"
 game_concept_protected_religion_desc: "Protected religions are religions protected from [forced_conversion|e]. Religions can be protected by specific [policies|e], being part of the [ShowEstateTypeName('dhimmi_estate')] or a country having high [heathenry_tolerance|e] or [heretic_tolerance|e]. High [heathenry_tolerance|e] or [heretic_tolerance|e] blocks conversion based on religion opinion:\n\nA religion viewed as #color_white Kindred#! is protected at or above -1.5 [tolerance|e]\nA religion viewed as #color_white Positive#! is protected at or above -0.5 [tolerance|e]\nA religion viewed as #color_white Neutral#! is protected at or above 0 [tolerance|e]\nA religion viewed as #color_white Negative#! is protected at or above 0.5 [tolerance|e]\nA religion viewed as #color_white Enemy#! is protected at or above 1.5 [tolerance|e]."
 game_concept_icd_forces: "Forces"
 game_concept_forcefully_converted: "Forcefully Converted"
 
 
 
 
 
 
 
 hint_icd_religion: "ICD: Religious Conversion"
 hint_icd_religion_hint_text: "This mod discards the way conversion works in vanilla, in favour of a new yearly conversion system. The idea is that religious conversion should feel slower when appropriate, but without being annoying or intrusive, while increasing the relevance of player choice. The new system doesn’t use cabinet slots and takes into account more nuanced demographic matters, applying to pops rather than to blanket locations. It should be more historically appropriate and should work better with the religious protections introduced by the mod as pops can be protected from conversion without blocking the conversion of other pops in the same location (Protecting Jews from conversion doesn’t block Muslims in the same location from getting converted, for example).\n\nThe disadvantage of this new system is that its rates and numbers are more hidden from the player (they can be viewed via the new mapmodes or by hovering over the monthly conversion in the location demography view). They are also calculated on a yearly basis, rather than monthly. Feel free to disable the new system in game rules if you dislike it.\n\nConversion in ICD’s new system removes the monthly conversion each location has, and removes the Convert Province cabinet action. Instead, it splits conversion into three types:\n\n - [communal_conversions|e]  are a passive form of conversion calculated each year. They happen under two circumstances - either when a non-[ethnic_religion|e] rules over a [ethnic_religion|e] and is present in their locations, or to pops belonging to a country’s [primary_culture|e] when said [primary_culture|e] is traditionally dominated by a single religion.\n - [voluntary_conversions|e] are a passive form of conversion calculated every four years. They happen to pops with [protected_religions|e], but are small in scale. This reflects an individual desire to convert rather than an imposed or mass conversion.\n - [forced_conversions|e] are an active form of conversion. They are handled via the Enforce Religious Conversion action in the religion tab, which replaces the Convert Province cabinet action. Provinces which are being forcefully converted will have their conversions calculated every year.\n\nCertain religions can be [protected_religions|e] in your territory. These are decided by laws, dhimmi status and a religion’s opinion of one another vs. tolerance (Kindred religions are protected at -1.5 tolerance, while Negative religions are protected only at 0.5). Protected Religions will not be converted by [forced_conversions|e] or [ethnic_religion|e]-based [communal_conversions|e]. They are vulnerable to culture-based [communal_conversions|e] and [voluntary_conversions|e].\n\nCertain religions are [ethnic_religions|e]. Folk Religions always spread to a country’s [primary_culture|e] via [communal_conversions|e], but they cannot spread beyond this culture. If Folk Religion pops are owned by a country without a Folk Religion and whose religion is present in their locations, they will convert away via Communal Conversion.\n\nThe different strategies one can use to deal with heathens and heretics can be summed up as:\na) having [tolerance|e] towards [heathens|e] and/or [heretics|e], leading some to convert via [voluntary_conversion|e]\nb) enacting [forced_conversions|e] on [pops|e] with the Enforce Religious Conversion action in the religion menu,\nc) assimilating pops to your culture so they will be converted by [communal_conversion|e],\nd) expelling pops (which will convert a part of them)."
