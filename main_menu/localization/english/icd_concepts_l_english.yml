l_english:
 game_concept_voluntary_conversions: "Voluntary Conversions"
 game_concept_voluntary_conversion: "Voluntary Conversion"
 game_concept_voluntary_conversion_desc: "Voluntary conversion is a form of [conversion|e] that occurs due to the initiative of individuals. This occurs when individuals choose to join a new religious community due to personal spiritual, economic or social concerns.\n\nVoluntary conversions are calculated in-game every four years but their impact is hidden and hard to determine. They are typically small in numbers but are not usually restricted by [control|e] (though they do not happen in [locations|e] with under 10 control or [conquered|e] locations). Conversion rate increases with [pop_satisfaction|e], [tolerance|e], and [ShowEstateTypeName('dhimmi_estate')] privileges."
 game_concept_forced_conversion: "Forced Conversion"
 game_concept_forced_conversions: "Forced Conversions"
 game_concept_forced_conversion_desc: "Forced conversion is a form of [conversion|e] imposed on the population, where they are coerced into abandoning their old religion and adhering to a new one. Forced conversion is not passive like other forms of conversion, instead it is calculated only for provinces affected by the Enforce Religious Conversion religious action.\n\nForced conversions are calculated every year. The base value is 150, and it is modified by [ShowModifierTypeName('global_pop_conversion_speed_modifier')], [ShowModifierTypeName('local_pop_conversion_speed_modifier')] and [control|e].\n[ShowSubjectTypeName('fiefdom')]s and [ShowSubjectTypeName('dominion')]s, as well as countries who had a religion enforced upon them will usually have a flimsy structure for their religion and will be hesitant to forcefully convert their locations."
 game_concept_communal_conversion: "Communal Conversion"
 game_concept_communal_conversions: "Communal Conversions"
 game_concept_communal_conversion_desc: "Communal conversion is a form of [conversion|e] that comes about due to cultural and religious shifts in an entire population group. These can occur if a religion is too small in your [primary_culture|e] to sustain itself, if a decentralised [ethnic_religion|e] is exposed to a more dominant religion or as a reaction to [movements|e].\n\nCommunal conversions are calculated every year, with a rate of around 50 [pops|e], modified by [ShowModifierTypeName('global_pop_conversion_speed_modifier')], [ShowModifierTypeName('local_pop_conversion_speed_modifier')] and [control|e]. The following are the major mechanics of communal conversion:\n\n  - As part or reaction to the Reformation, pops of your [primary_culture|e] will convert to your religion\n  - If your culture or society is dominated by a particular religion, pops of your [primary_culture|e] will convert to your religion (if a fraction of a country's population, greater than 4%, is of their [primary_culture|e] but with a different [religion|e], this will not activate. Certain culture groups: Jewish, French, Tatar, Mongolian, East Slavic, Lithuanian, Chinese, Arabic, have this mechanic for their entire culture group).\n  - Pops belonging to an [ethnic_religion|e] will always convert to their country's religion if it is not an [ethnic_religion|e]."
 game_concept_ethnic_religion: "Ethnic Religion"
 game_concept_ethnic_religions: "Ethnic Religions"
 game_concept_ethnic_religion_desc: "Ethnic religions are religions that are fully tied to a culture or cultures. These religions typically will only spread to their country's [primary_culture|e]. They are also vulnerable when a community is ruptured, and ethnic religions will struggle to sustain themselves if they are ruled by a proselytising country that does not possess an [ethnic_religion|e] itself."
 game_concept_protected_religion: "Protected Religion"
 game_concept_protected_religions: "Protected Religions"
 game_concept_protected_religion_desc: "Protected religions are religions protected from [forced_conversion|e]. Religions can be protected by specific [policies|e], being part of the [ShowEstateTypeName('dhimmi_estate')] or a country having high [heathenry_tolerance|e] or [heretic_tolerance|e]. High [heathenry_tolerance|e] or [heretic_tolerance|e] blocks conversion based on religion opinion:\n\nA religion viewed as #color_white Kindred#! is protected at or above -1.5 [tolerance|e]\nA religion viewed as #color_white Positive#! is protected at or above -0.5 [tolerance|e]\nA religion viewed as #color_white Neutral#! is protected at or above 0 [tolerance|e]\nA religion viewed as #color_white Negative#! is protected at or above 0.5 [tolerance|e]\nA religion viewed as #color_white Enemy#! is protected at or above 1.5 [tolerance|e]."
 
