 icd_zaydi_reform.title: "Implement Institutional-Theological Reform"
 icd_zaydi_reform.desc: "Zaydi theology centers a considerable amount of political authority around the Imam, but indirectly legitimises resistance against an unproven claimant to political leadership due to the idea of righteous rebellion inherent in the concept of khuruj. If we must secure our rule across generations, institutional reforms must be put in place to prevent and undermine any rival claimants to our state.\n\nWe must implement reforms gradually, around four times in total."
 icd_zaydi_reform.a: "Implement the next series of reforms"
 icd_lower_khuruj: "Lowers the impact of Khuruj events on ruler death"
 icd_stop_khuruj: "End Khuruj events on ruler death"
