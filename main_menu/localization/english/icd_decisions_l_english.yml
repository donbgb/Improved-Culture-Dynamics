 icd_claim_shadow_of_god.title: "Claim Title: Shadow of God"
 icd_claim_axis_of_the_realm.desc: "We must legitimise our claim to power not only through actions but through theology. By positioning our ruler within a certain context in the Shia faith, we will reap immense benefits."
