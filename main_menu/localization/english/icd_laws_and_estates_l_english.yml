l_english:
 cultural_majority_law: "Cultural Majority"
 cultural_majority_law_desc: "Determines the autonomy and privileges that large communities have over their territories."
 
 
 minority_rule: "Minority Rule"
 minority_rule_desc: "The cultural identity of our political elite is not shared by the vast majority of the populace. In order to govern our territory, we must necessarily permit other cultures to have a degree of autonomy and political presence."
 persianate: "Persianate"
 persianate_desc: "Though the cultural identity of our political elite is entirely separate and distinct, we have been strongly influenced by Persian culture, with our court reflecting Persian customs and our government using the Persian language for communication."
 cultural_manifestation_privileges: "Cultural Patronage"
 cultural_manifestation_privileges_desc: "Our state and local elites are encouraged to sponsor and support cultural minorities and their celebrations and rituals."
 guild_restrictions: "Association Restrictions"
 guild_restrictions_desc: "Cultural minorities are often restricted from joining guilds and creating their own economic or professional associations, funneling them towards integration into our state."
 self_governing_institutions: "Self-Governing Institutions"
 self_governing_institutions_desc: "The cultural minorities in our territory retain some level of political and social autonomy, being able to organise themselves politically, legally and socially in given spaces."
 icd_privileges_in_hungary: "Privileges in Hungary"
 icd_privileges_in_hungary_desc: "Various communities and peoples that live in the Kingdom of Hungary enjoy varying levels of political and cultural autonomy - Vlach law, the autonomy of Transylvania, German town rights, among other policies. In exchange for these privileges, these communities are expected to support the kingdom of Hungary militarily and politically." 
 assertive_assimilation: "Cultural Centralization"
 assertive_assimilation_desc: "Cultures manifest themselves through our bureaucracy and governing institutions, which exercise significant central authority over minorities."

 icd_politics_of_language_law: "Politics of Language"
 icd_politics_of_language_law_desc: "Beyond questions of the language of pleading, our stance in regards to the languages spoken in our state must be clarified."
 monolingual_courts: "Monolingual Forums"
 monolingual_courts_desc: "Judicial courts, local councils and any other governmental spaces are to use only our main common language for all matters. Local languages are not to be given any public role."
 language_of_opportunity: "Language of Opportunity"
 language_of_opportunity_desc: "Though there is some space for the use of local languages, most public matters are dealt with in our main common language. Anyone who wishes to ascend and improve his lot in life, must be willing to master our language and assimilate."
 linguistic_autonomy: "Linguistic Autonomy"
 linguistic_autonomy_desc: "Communities have a large degree of autonomy to work and conduct matters in their own language."
 language_of_the_elites: "Learned Language of the Elites"
 language_of_the_elites_desc: "Our common language is the language of the elite and the educated, not of the masses. We must maintain our language's dignity and strength among all the wealthy and powerful in our territory and must prevent our speech from being sullied by the rabble."
 ordinance_of_villers_cotterets: "Ordinance of Villers-Cotterêts"
 ordinance_of_villers_cotterets_desc: "The use of French is mandatory in all legal acts, notarized contracts and official legislation. Latin is no longer to be utilised and if this policy makes the use of patois difficult, so be it." 
 
 icd_politics_of_ritual_law: "Politics of Ritual"
 icd_politics_of_ritual_law_desc: "The relationship between culture and faith in our government and society must be outlined and structured."
 religious_and_ritual_regulation: "Regulatory Bureaus"
 religious_and_ritual_regulation_desc: "All religions and cultural rituals in our territory are to be supervised by a political agency. Members of cultural or religious communities must adhere to regulations issued by the respective agency."
 cultural_religious_subversion: "Cultural and Religious Restrictions"
 cultural_religious_subversion_desc: "Culture and religion are inseparable, and in order to assure that our population does not deviate religiously or culturally, we must ensure that all in our territory are integrated into both our faith and our identity. Traditions, customs, beliefs and texts that do not conform with our worldview are to be discouraged and purged when necessary."
 faith_across_cultures: "Faith Across Ethnicities"
 faith_across_cultures_desc: "It is faith that unites us, not language or ethnicity. Religion traverses the boundaries and limits of culture, and our faith must at times adopt to local traditions and customs rather than the contrary."
 enshrined_cosmopolitanism: "Enshrined Cosmopolitanism"
 enshrined_cosmopolitanism_desc: "Our country is inherently multireligious and multicultural, and it can only prosper and sustain itself if most cultural and religious expressions are respected."
 
 icd_national_identity_law: "National Identity"
 icd_national_identity_law_desc: "The development of an imagined community among our peoples can be a tool for our state but also a source of division and strife. We must outline what kind of community and identity our country should be based upon."
 civic_nationhood: "Civic Nationhood"
 civic_nationhood_desc: "Our country is a nation-state that represents a singular nation. This nation is defined by its culture, values and traditions, rather than necessarily ties of blood."
 ethnic_identity: "Ethnic Identity"
 ethnic_identity_desc: "Our national identity derives from our shared ancestry, history and ethnic ties. We are one people of ancient origin."
 subjecthood: "Subjecthood"
 subjecthood_desc: "Our country's identity is sustained through its monarchy and association with the ruling dynasty."
 union_of_many: "Union of Many"
 union_of_many_desc: "Our country undoubtedly is populated by nations but it is not defined by one of them. Our politics creates the bridges that connect the various peoples in our territory."
 religious_community: "Religious Community"
 religious_community_desc: "Our country is defined through its faith and religion, uniting all people under a supranational religious community."
 
 
 jewish_charter: "Jewish Charter"
 jewish_charter_desc: "By enacting a charter that protects the rights of Jewish communities in our territory, including legal protection, rights of residence, freedom of trade, and religious autonomy, we can ensure that both our towns and the local Jewish communities prosper."
  
 standardised_system_of_education: "Standardised Education"
 standardised_system_of_education_desc: "A singular standardised system of education will permit us to not only greatly improve the acess that all of our people have to education but also ensure that we are promoting a singular culture that reflects our state's values."

 national_identity: "National Identity"
 national_identity_desc: "One state, one nation. We have become aware of our unity and our identity, and must spread it if we wish to hold to greater territory."
 
 regional_autonomy: "Pluricultural Society"
 regional_autonomy_desc: "Our society emerges not from a singular culture but from multiple distinct identities. Distinct parts of our nation are given varying levels of cultural autonomy."
 ethnic_communities: "Gradual Integration"
 ethnic_communities_desc: "We encourage those communities and minorities closest to our primary culture to adopt our ways and learn from our behaviour. Areas that are more distant, however, are free to retain their own arrangements."
 monocultural_opportunity: "Mass Assimilation"
 monocultural_opportunity_desc: "Our society is built on one culture alone and we promote one culture only, as such. Wherever our state goes, it seeks to spread and promote our cultural attitudes and traditions."
 dialects_of_german: "Plural German Identities"
 dialects_of_german_desc: "There are many kinds of Germans in the world, and though we represent only a specific kind of German, we recognise and appreciate the differences that exist between all of us."
 dialects_of_arabic: "Plural Arab Identities"
 dialects_of_arabic_desc: "There are many kinds of Arabs in the world, and though we represent only a specific kind of Arab, we recognise and appreciate the differences that exist between all of us."
 dialects_of_italian: "Plural Italian Identities"
 dialects_of_italian_desc: "There are many kinds of Italians in the world, and though we represent only a specific kind of Italian, we recognise and appreciate the differences that exist between all of us."
 
 colonial_culture: "Colonial Assimilation"
 colonial_culture_desc: "Colonial structures based on exploitation, colonization and the dismantlement of local cultural institutions make assimilation more efficient and economically productive."
 
 minority_rule_tt: "With this policy, pops will only assimilate to their province's dominant culture, regardless of the country's primary culture. This policy creates a risk for the primary culture as primary culture minorities will get assimilated into their respective locations' dominant culture. Reducing cultural assimilation becomes preferable to increasing it. This can only be altered with the use of the Promote Culture cabinet action. The Marking cabinet action is disabled."
 regional_autonomy_tt: "With this policy, pops will only assimilate to their province's dominant culture, regardless of the country's primary culture. This policy makes migration of your primary culture into dominant culture locations ineffective. This can only be altered with the use of the Promote Culture cabinet action or the Marking cabinet action, which temporarily changes this dynamic in the province it applies to."
 ethnic_communities_tt: "With this policy, pops will assimilate only to their province's dominant culture unless they neighbour your primary culture or there are significant minorities in those provinces belonging to your primary culture. This policy stimulates the primary culture to spread out from its borders and from settlers, while preserving more distant cultures. This can only be altered with the use of the Promote Culture cabinet action or the Marking cabinet action, which temporarily changes this dynamic in the province it applies to."
 monocultural_opportunity_tt: "With this policy, pops will assimilate to the country's primary culture, unless the Promote Culture cabinet action or the Marking cabinet action are used."
 dialects_of_german_tt: "With this policy, pops of German cultures are not assimilated (excluding Czech and Frisian). Pops that are not German are assimilated to a neighbouring German culture. The Promote Culture cabinet action or the Marking cabinet action can override this."
 dialects_of_arabic_tt: "With this policy, pops of Arabic cultures are not assimilated (excluding Syriac). Pops that are not Arabic are assimilated to a neighbouring Arabic culture. The Promote Culture cabinet action or the Marking cabinet action can override this."
 dialects_of_italian_tt: "With this policy, pops of Italian cultures are not assimilated. Pops that are not Italian are assimilated to a neighbouring Italian culture. The Promote Culture cabinet action or the Marking cabinet can override this."
 
 icd_nothing_price: "Costs nothing"
  
 new_foreign_cultural_law: "Cultural Minorities"
 new_foreign_cultural_law_desc: "The existence of small minority groups within our state requires us to adopt specific policies and political institutions to deal with them."
 this_policy: "this"
 this_policy_desc: "This"
 
 icd_jewish_charter_tt: "Where there is a [ShowReligionAdjective('judaism')] community and no heretics or pagans:"
 
 turkic_integration: "Turkic Integration"
 turkic_integration_desc: "Our culture as Turks and our Muslim religion are inevitably tied. As we expand into the east and west, other cultures with different religions will likely be far more easier to bring into our fold if we convert or assimilate them first." 
 
 icd_vlach_law: "Vlach Law"
 icd_vlach_law_desc: "By permitting our Vlach subjects to follow Romanian common law, we can respect their traditional way of life and profit from it through the animal goods their pastoralism brings to neighbouring communities." 
 
 
 icd_entrenched_tribal_livelihood: "Entrenched Tribal Structures"
 icd_entrenched_tribal_livelihood_desc: "The decentralised communities that sit on the edges of our society are well-established and integral to the land they inhabit. Any attempt at disloding them would be met with fierce resistance. Perhaps we have no choice but to accept their presence."
 icd_tribal_governorates: "Tribal Governorates"
 icd_tribal_governorates_desc: "By making the tribesmen in our society into governors and allowing them to join our administrative elite, we are able to access villages and settlements that typical civilian administrators would have a hard time dealing with."
 icd_frontier_armed_tribesmen: "Armed Frontiersmen"
 icd_frontier_armed_tribesmen_desc: "Along our frontier, we have granted the privilege to bear arms and to exploit the land to various semi-nomadic communities. Their aid will be essential in protecting our borders."
 icd_tribal_cavalry_logistics: "Tribal Cavalry Logistics"
 icd_tribal_cavalry_logistics_desc: "By relying on nomadic and semi-nomadic horsemen to supply and support our armies, we are able to penetrate deeper and faster into enemy territory."
 icd_tribal_commercial_networks: "Decentralised Commercial Networks"
 a_tribal_cavalry_renaissance: "Late Tribal Cavalry"
 icd_tribal_commercial_networks_desc: "The tribesmen in our society are very commercially active. Recognising and sponsoring this reality allows us to gain access to their knowledge and expertise."
 a_tribal_cavalry_renaissance_desc: "Many of the tribes living on the outskirts of our country base their existence around the raising and caring of horses and cattle, by living their whole lives around these animals, they are bound to raise great riders among their midst.\n\nOn the rare occasion when a strong hand manages to organize this unruly fighters into a semi coherent unit they form a fast and surprisingly effective force."
 a_tribal_cavalry_discovery: "Tribal Lancer"
 a_tribal_cavalry_discovery_desc: "Many of the tribes living on the outskirts of our country base their existence around the raising and caring of horses and cattle, by living their whole lives around these animals, they are bound to raise great riders among their midst.\n\nOn the rare occasion when a strong hand manages to organize this unruly fighters into a semi coherent unit they form a fast and surprisingly effective force."
 unlock_tribal_cavalry_renaissance_advance: "Late Tribal Cavalry"
 unlock_tribal_cavalry_renaissance_advance_desc: "Many of the tribes living on the outskirts of our country base their existence around the raising and caring of horses and cattle, by living their whole lives around these animals, they are bound to raise great riders among their midst.\n\nOn the rare occasion when a strong hand manages to organize this unruly fighters into a semi coherent unit they form a fast and surprisingly effective force."
 unlock_tribal_cavalry_discovery_advance: "Tribal Lancer"
 unlock_tribal_cavalry_discovery_advance_desc: "Many of the tribes living on the outskirts of our country base their existence around the raising and caring of horses and cattle, by living their whole lives around these animals, they are bound to raise great riders among their midst.\n\nOn the rare occasion when a strong hand manages to organize this unruly fighters into a semi coherent unit they form a fast and surprisingly effective force."
 
 icd_unify_the_tribes: "Unify the Tribes"
 icd_unify_the_tribes_desc: "Our people are too divided. By maintaining a more clear and cohesive central culture, language and identity, we can bring together different clans and communities into a greater whole."
 icd_unify_the_tribes_tt: "Enables Assimilation of Tribesmen Pops"
 
 icd_invite_german_settlers_tt: "Every location which has a considerable German community:"
 any_accepted_culture_all: "Any Accepted culture:"
 any_tolerated_culture_all: "Any Tolerated culture:"
 icd_german_language_tt: "Language is not German"
 icd_romanian_language_tt: "Language is not Romanian"
 icd_lingering_german_communities: "Lingering German Communities"
 icd_lingering_german_communities_desc: "Despite having ceased to accept German settlers and migrants, those Germans that have already found a place in our society remain a powerful political and cultural group. If we seek to integrate them into our polity, we will need to curtail a few of their privileges."

 ecumenic_traditions: "Ecumenic Traditions"
 ecumenic_traditions_desc: "Societal order and our state's acceptance of different religions has led to the assimilation and unison of peoples belonging to different religious communities."
 
 
 jewish_banned_tt: "We have not decided to expel or remove protections from our Jewish population"
 
 
 icd_romani_privilege_tt: "Every [location|e] with [ShowCultureName('romani_culture')], [ShowCultureName('domari_culture')] or [ShowCultureName('lomari_culture')] [ShowPopTypeName('tribesmen')]:"
 icd_romani_slaves: "Romani Slaves"
 icd_romani_slaves_desc: "The Romani people are to be organized into a rigid system of slavery, being able to be bought and sold between nobles, the Crown and landowning monasteries. They are used both as house slaves (tigani de casati) and field slaves (tigani de ogor), as well as in other tasks"
 icd_anti_romani_laws: "Anti-Romani Laws"
 icd_anti_romani_laws_desc: "The opportunities available to the Romani people are severely restricted and their freedoms impeded. Their ability to own land is limited, they are not permitted to participate in church service and they are forbidden from becoming members of guilds. They are expected to live separately from society and to have limited access to it"
 icd_romani_craftsmen: "Romani Craftsmen"
 icd_romani_craftsmen_desc: "The Romani are treated as a distinct professional class. They are still heavily scrutinised and restricted in their activity, but are otherwise permitted to openly engage in various trades such as gunsmithing, smelting, tin-plating, sieve-making and others." 
 
 icd_dhimmi_communities_protection: "Contract of Protection"
 icd_dhimmi_communities_protection_desc: "A [ShowReligionGroupAdjective('muslim')] state and its [ShowEstateTypeName('dhimmi_estate')] subjects are bound by a contract of protection - the ʿaqd al-dhimma. Per the contract, the [ShowEstateTypeName('dhimmi_estate')] are not to be coerced into any faith and must be allowed to practice their religion freely and in safety. In return, they must pay the jizya tax and follow principles that ensure they show respect towards their [ShowReligionGroupAdjective('muslim')] sovereign. The question, however, is to what extent these protections should be upheld and which communities should be deserving of said protections. Deciding which faiths are part of the [ShowEstateTypeName('dhimmi_estate')] and whether they should have their faith fully protected is a question only our state will be able to answer."
 icd_dhimmi_communities_trigger_tt: "Every [location|e] where a [ShowEstateTypeName('dhimmi_estate')] community is present:"
 icd_dhimmi_communities_allow_tt: "Must recognise the [ShowEstateTypeName('dhimmi_estate')]"
 icd_dhimmi_communities_revoke_tt: "Can only be revoked if no [ShowEstateTypeName('dhimmi_estate')] are recognised by the state."

 icd_permitted_restoration: "Permitted Restorations"
 icd_permitted_restoration_desc: "The [ShowEstateTypeName('dhimmi_estate')] are permitted to freely repair and restore religious buildings and places of worship without requesting specific authorization from local [ShowReligionGroupAdjective('muslim')] authorities. Such permission strengthens the [ShowEstateTypeName('dhimmi_estate')]'s freedoms and makes them happier, at the cost of weakening our attempts at conversion."
 icd_permission_for_awqaf: "Permission for Awqāf"
 icd_permission_for_awqaf_desc: "Wealthy members of the [ShowEstateTypeName('dhimmi_estate')] who lack suitable heirs may choose to allocate charitable endowments, known as awqāf, to religious institutions and religious groups in their will. While many consider such donations to be aid in strengthening and propagating a heathen religion, permitting such a dynamic makes our people happier."
 icd_sufi_coexistence: "Sufi Syncretism"
 icd_sufi_coexistence_desc: "Sufi orders have an important role to play in bridging the divide between Muslims and non-Muslims. Their rituals and practices are often seen as similar to existing rituals held by the dhimmi, and by permitting the Sufis to occupy an important position in interfaith relations, we encourage heathens to seek Sufi counsel and wisdom and to syncretise some of their beliefs with Islam."
 icd_abandon_the_ghiyar: "Abandon the Ghiyār"
 icd_abandon_the_ghiyar_desc: "The ghiyār are the sumptuary rules that dictate what non-Muslims can wear and how they can behave. By relaxing and abandoning some of these rules, we bridge the gap between Muslim and non-Muslim and make life less hostile and divisive for the [ShowEstateTypeName('dhimmi_estate')]."
 
 icd_druze_emirs: "Hereditary Druze Emirs"
 icd_druze_emirs_desc: "By permitting Iqta appointments in Mount Lebanon and Jabal al-Druze to become effectively hereditary, being passed from brother to brother and father to son in specific Druze dynasties, we ensure that we have powerful allies in this part of the Levant, who are willing to support us militarily in return for their religious and political autonomy."