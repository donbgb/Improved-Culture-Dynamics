 icd_consultation: "Consultation"
 icd_consultation_desc: "Islamic empires that utilise the Iqta system do not have large aristocracies sufficiently independent of the state to defend their rights in typical parliamentary structures. Instead, Muslim rulers are relatively free to do what they wish, though they usually seek to consult powerful elites first to avoid backlash."
 icd_protection_from_confiscation: "Protection from Confiscation"
 icd_protection_from_confiscation_desc: "Secure a considerable number of noble estates under private ownership agreements, rather than the usual Iqta system, thereby increasing the security and trust of the elites in our state."
