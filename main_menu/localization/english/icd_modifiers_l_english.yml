 azeri_culture_movement: "Azerification of Adharis"
 azeri_culture_movement_desc: "The migration of Turks into the Caucasus has caused a gradual transformation of Adhari culture. Adhari people increasingly speak the Turkic Azeri language and adopt Turkic customs. All Adhari pops under Turkic or Mongolian governments, or under the rule of a government that doesn't culturally accept them but accepts Azeri, will become Azeri over time."
 azeri_culture_movement_location_modifier: "Azeri Culture Movement Location Modifier"
 dutch_culture_movement: "Dutch Convergence"
 dutch_culture_movement_desc: "The creation of the Netherlands will lead to the formation of a distinct political culture associated with it. The primary culture of the Netherland's founding states will adopt this new identity first, partly followed by other cultures of the Low Countries. Once the formation of this identity begins, related cultures that sit outside the Netherlands will not adopt the identity so readily."
 dutch_culture_movement_location_modifier: "Dutch Culture Movement Location Modifier"
 lithuanian_culture_movement: "Lithuanian Ethnogenesis"
 lithuanian_culture_movement_desc: "The Duchy of Lithuania has brought unity to the Aukstaitian and Samogitian peoples. A new identity and culture will form among them once the state begins a process of cultural integration."
 lithuanian_culture_movement_location_modifier: "Lithuanian Culture Movement Location Modifier"
 russian_culture_movement: "Russian Ethnogenesis"
 russian_culture_movement_desc: "The unification of the lands of Rus has brought the unification of distinct East Slavic dialects under a larger umbrella of Russian identity. A new identity and culture will form among the East Slavs that are accepted by the Russian state, but will exclude peoples that have not been brought under Russian authority."
 russian_culture_movement_location_modifier: "Russian Culture Movement Location Modifier"
 ruthenian_culture_movement: "Ruthenian Ethnogenesis"
 ruthenian_culture_movement_desc: "The establishment of a united Ruthenia has brought the unification of distinct East Slavic dialects under a larger umbrella of Ruthenian identity. A new identity and culture will form among the East Slavs that are accepted by the Ruthenian state, but will exclude peoples that have not been brought under Ruthenian authority."
 ruthenian_culture_movement_location_modifier: "Ruthenian Culture Movement Location Modifier"
 
 turkification_culture_movement: "Turkification of Mongols"
 turkification_culture_movement_desc: "The intermixing of Turkish and Mongol culture has led to the formation of a distinct Turco-Mongol identity. Over time, Mongols that are not governed by a Mongol government that can defend their interests, will adopt the Turkish language and a Turkic identity." 
 turkification_culture_movement_location_modifier: "Turkification of Mongols Location Modifier"
