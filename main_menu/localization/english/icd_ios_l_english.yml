 icd_sunni_caliphate_desc: "The community of Sunni Muslims does not possess a formal leadership or structure but informally legitimises and structures itself around the most recognised and powerful of those that claim the title of caliph."
 icd_caliphate_claimant: "Caliphate Claimant"
 icd_caliphate_claimant_desc: "States that have taken on the title of Caliph or Amir al-Mu'minin, though have yet to acquire a widespread recognition of this title beyond their borders, by the Sunni world at large."
 
