 icd_nizari_imamate_io: "Nizari Jamat"
 icd_nizari_imamate_io_desc: "The Nizari Isma'ili community is organised cohesively around the leadership of the living Nizari Isma'ili Imam. He commands significant spiritual authority, even if he does not command the secular world directly."
 icd_nizari_laws: "Period of the Community"
 icd_nizari_laws_desc: "The Nizari Isma'ili community has seen rises and falls throughout its history. No matter the political or societal reality, the Nizari Isma'ili must be ready to adapt and survive."
 icd_taqiyya_stance: "Taqiyya Period"
 icd_taqiyya_stance_desc: "The Imam and his followers conceal their beliefs, pretending to be part of a Sunni or Shia Sufi order rather than a distinct religion."
 icd_revival_stance: "Revival Period"
 icd_revival_stance_desc: "The Imam and his followers have found a secure and proper place to call their own. They do not fear for their lives and promote the religion freely"
 icd_ascension_stance: "Preeminence Period"
 icd_ascension_stance_desc: "The Imam is secure that the countries ruled by his followers are able to promote and defend the religion no matter what happens."
 icd_aga_khan: "Aga Khan Period"
 icd_aga_khan_desc: "The Imam has received the title of Aga Khan and has begun to find new ways of organizing the Nizari community, to respond to the changing times."
 icd_sadr: "Satr Period"
 icd_sadr_desc: "After the destruction of Nizari places of worship, the Imam has gone into a period of hiding/concealment, dawr al-satr, and will be represented only through agents during this time."
 
 icd_imamate_stability: "Imamate Stability"
 icd_imamate_stability_desc: "How stable the Imamate is as an institution"
 
 io_opinion_icd_nizari_imamate_io: "Fellow Nizari"
 