 tibetan_buddhism: "Tibetan Mahāyāna"
 tibetan_buddhism_ADJ: "Tibetan Mahāyāna"
 mahayana: "Eastern Mahāyāna"
 mahayana_ADJ: "Eastern Mahāyāna"
 mahayana_desc: "Eastern Mahāyāna refers to related sects of Mahāyāna $buddhist$ that largely took shape in $china$ and the Silk Road. Though in China, Korea and Vietnam, Mahāyāna Buddhism is generally a manifestation of a larger religious framework and usually does not exist independently of Confucianism, Chinese Buddhist sects and the $chinese_group$ Canon were introduced independently into the Silk Road, permitting the spread of a disconnected Eastern Mahāyāna faith. This faith is characterised not only by typical Mahāyāna beliefs such a belief in the $bodhisattva$ path as available to all as a way to achieve Buddhahood, but also by its syncretism with pre-existing Tocharian Buddhist practices and by its strong sense of individual freedom in practicing faith, freely merging and intersecting texts and beliefs."
 sanjiao_desc: "The term 'Three Teachings' (sānjiào) or tam giáo in Vietnamese and samgyo in Korean, refers to the polytheistic faiths present in China, Korea and Vietnam, whose theological and structural organization largely derive from the three teachings of $confucianism_policy$, $daoism_policy$, and $buddhist$. Having developed and incorporated each other as part of a broader religious worldview, the Three Teachings do not exist independently of each other or of folk polytheism, instead being distinct manifestations of a broader religious context."
    
 miaphysite: "Oriental Orthodoxy"
 miaphysite_ADJ: "Oriental Orthodox"
 nestorianism: "East Syriac"
 nestorianism_ADJ: "East Syriac"
 nestorianism_desc: "$nestorianism$ refers to the beliefs and practices of the Church of the East, whose distinction and division from other branches of Christianity relate not only to their use of the East Syriac Rite but to the work of Assyrian bishop Babai the Great regarding Christology. Babai promulgated a dyophiste theology, affirming that the two 'qnome' of Christ are unmixed but eternally united in his single 'parsopa'. Though this branch of Christianity venerates Nestorius of Constantinople as a saint and is often labelled as 'Nestorian' by other Christians, East Syriac Christianity does not follow Nestorius' supposed teachings as it does not believe that two persons exist in the one body of Christ."

 anglo_irish: "Hiberno-Norman"
 
 calvinist: "Reformed"
 calvinist_ADJ: "Reformed"
 calvinist_desc: "A religion that initially took shape based on the teachings of Huldrych Zwingli and John Oecolampadius, but was given greater definition by John Calvin and Heinrich Bullinger, $calvinist$ is a significant branch of Protestantism rooted in the principles of simplicity in worship and the supremacy of the Holy Bible. Its doctrine emphasizes predestination, asserting that God has preordained the destiny of all creation."

 
 enforce_culture: "Enforce Culture"
 enforce_culture_act: "Enforce Culture in [SCOPE.sCountry('recipient').GetName]"
 enforce_culture_desc: "We will demand that they adopt a given culture as their primary culture."
 enforce_culture_effect_text: "[SCOPE.sCountry('actor').GetName] enforce a culture on [SCOPE.sCountry('recipient').GetName]"
 enforce_culture_effect_text_past: "[SCOPE.sCountry('actor').GetName] enforced a culture on [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_enforce_culture: "Enforce Culture in $RECIPIENT$?\n$INFO$."
 INCOMING_OFFER_union_enforce_culture: "$ACTOR$ are trying to enforce a [culture|e] on us. Do we let it happen?\n\n$INFO$"


 dhimmi_land_rights: "Guarantee Village Rights"
 dhimmi_land_rights_desc: "Towns and villages with a strong heathen majority can be given greater freedom over their religious expression. Their residents need not be as concerned about following the requirements and mandates of the #italic Ḏimmī#!"



 flavor_swi.conversion.tt: "Some of our [pops|e] in [ROOT.GetCountry.GetName] will convert to [ShowReligionName('calvinist')]."
 flavor_swi.1101.desc: "The sermons of [target_character.GetName] changed over the last couple of years. Where he initially preached in accordance with the [ShowReligionAdjective('catholic')] doctrine, he now tends to strife far from it. More and more, his speeches include criticism of [ShowReligionAdjectiveWithNoTooltip('catholic')] rituals like fasting and clerical celibacy. Moreover, his teachings also appear to be opposed to [ShowReligionAdjectiveWithNoTooltip('lutheran')] doctrines. A confrontation about his actions could spark an outrage among his followers, but might be necessary if we want to preserve the integrity of the [ShowReligionAdjectiveWithNoTooltip('catholic')] faith."
 flavor_swi.large_conversion.tt: "A lot of our [pops|e] in [ROOT.GetCountry.GetName] will convert to [ShowReligionName('calvinist')]."
 flavor_swi.1104.title: "Support for [target_character.GetNameWithNoTooltip]"
 zwingli_support_rebels_joining: "All [ShowReligionAdjective('calvinist')] [pops|e] in [ROOT.GetCountry.GetNameWithNoTooltip] lose [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] [pop_satisfaction|e] and join [target_zwingli_support_rebels.GetName]."
 flavor_swi.1103.desc: "With the continuous effect of [target_character.GetName] and other preachers who have joined his cause, [ROOT.GetCountry.GetName] is now a predominant [ShowReligionAdjective('calvinist')] country. Due to their widespread influence, we will have no choice but to proclaim [ShowReligionNameWithNoTooltip('calvinist')] as our faith."
 flavor_swi.1104.c: "Perhaps [target_character.GetNameWithNoTooltip] is right"

 zwingli_support_rebels_joining: "All [ShowReligionAdjective('calvinist')] [pops|e] in [ROOT.GetCountry.GetNameWithNoTooltip] lose [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] [pop_satisfaction|e] and join [target_zwingli_support_rebels.GetName]."
 flavor_swi.111.desc.fallback: "[ShowReligionAdjective('catholic')] and [ShowReligionAdjective('calvinist')] members alike see each other with hostility. Such an encounter eventually escalated in [target_location.GetName], becoming the trigger for what will be known as the Wars of [target_location.GetNameWithNoTooltip]."


 game_concept_conversion_desc: "This is the process by which [pops|e] change from one [religion|e] to another over time. If vanilla conversion is disabled, this can happen in one of three ways: [pops|e] can be forced to convert via [forced_conversion|e], [pops|e] may individually convert every four years through [voluntary_conversion|e], and [pops|e] can convert in groups due to social circumstances based on [communal_conversion|e]."

 ##not overwrite change location later##
 flavor_swi.german_conversion.tt: "A lot of our [ShowCultureNameWithNoTooltip('high_alemannic')] [pops|e] in [ROOT.GetCountry.GetName] will convert to [ShowReligionName('calvinist')]."
 flavor_swi.german_small_conversion.tt: "Some of our [ShowCultureNameWithNoTooltip('high_alemannic')] [pops|e] in [ROOT.GetCountry.GetName] will convert to [ShowReligionName('calvinist')]."
 flavor_swi.9990.title: "Spread of [target_character.GetNameWithNoTooltip]'s Teachings"
 flavor_swi.9990.desc: "The teachings of [target_character.GetNameWithNoTooltip] have spread to our country and people, where they have found significant traction with the [ShowCultureNameWithNoTooltip('high_alemannic')]. This brings great concern to our [ShowReligionAdjective('catholic')] clerics as it indicates a shift in our society towards [ShowReligionName('calvinist')]."
 flavor_swi.9990.a: "There isn't much we can do about this"
 flavor_swi.9990.b: "Perhaps [target_character.GetNameWithNoTooltip] is right"
 flavor_swi.9990.c: "We must act to contain the spread of this heresy!"

