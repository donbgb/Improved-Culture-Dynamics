 icd_intro_event.1.title: "Intro"
 icd_intro_event.1.desc: "Welcome to Improved Cultural Dynamics. This mod makes large changes to everything related to culture and religion, seeking to enhance immersion and plausibility. This event serves as an intro to the different mechanics in the mod. More information can be found in the mapmodes and by looking up game concepts in the Europedia.\n\nIf you do not wish to see this event again, please go to Game Rules, ICD: Intro Event and change to 'Turn Off Intro Event'.\n\nNew map modes in this mod: Religious Conversion Mapmode, Voluntary Conversion Mapmode, Communal Conversion, Cultural Majority Assimilation, Tolerance of Heathens, Tolerance of Heretics. Type ICD into mapmode search to see all of them."
 icd_intro_event.1.a: "Tell me about the changes to [religion|e] and [conversion|e]"
 icd_intro_event.1.b: "Tell me about the changes to [culture|e]"
 icd_intro_event.1.c: "Tell me about the changes to [ShowPopTypeName('tribesmen')]"
 icd_intro_event.1.d: "Tell me about the changes to the [ShowSituationName('reformation')]"
 icd_intro_event.1.e: "Tell me about the changes to specific religions"
 icd_intro_event.1.f: "I'm good"
 icd_intro_event.2.title: "Changes to Religion"
 icd_intro_event.2.desc: "DISCLAIMER: The changes to religious conversion can be turned off in the Game Rules, ICD: Religious Conversion.\n\nThis mod discards the way conversion works in vanilla, in favour of a new yearly conversion system, which should be more interesting. It doesn’t use cabinet slots and applies to pops rather than to locations. It should work better with the religious protections introduced by the mod as pops can be protected from conversion without blocking the conversion of other pops in the same location.\n\nThe disadvantage of this new system is that its values can only be viewed via the new mapmodes or by hovering over monthly conversion in the location demography view, and that conversions are calculated on a yearly basis.\n\nThe different strategies one can use to deal with heathens and heretics can be summed up as:\na) having [tolerance|e] towards [heathens|e] and/or [heretics|e], leading some to convert via [voluntary_conversion|e]\nb) enacting [forced_conversions|e] on [pops|e] with the Enforce Religious Conversion action in the religion menu,\nc) assimilating pops to your culture so they will be converted by [communal_conversion|e],\nd) expelling pops (which will convert a part of them).\n\nFor starters, one can get used to the new system by understanding that the “Enforce Religious Conversion” action in the religion menu has replaced the Convert Province cabinet action, and by looking at the different game concepts in the Europedia and the ICD mapmodes. Conversion is divided into three types: [forced_conversions|e], [voluntary_conversions|e] and [communal_conversions|e] and these are calculated in the background every year."
 icd_intro_event.2.a: "Understood, go back to the introduction"
 icd_intro_event.2.b: "I have seen enough"
 icd_intro_event.3.title: "Changes to Culture"
 icd_intro_event.3.desc: "This mod makes it so cultural assimilation has to obey certain rules depending on the relationship between the state and its culture. This is governed by the [ShowLawName('cultural_majority_law')]. [ShowPolicyName('ethnic_communities')], the most common policy of that law, only permits assimilation to your culture in locations that border locations where your culture is dominant and those that have sizeable minorities (10%) of your culture.\n\nAs in vanilla, your Monthly Assimilation is a base number of +X that gets increased by modifiers and then gets massively capped by control. At the start of the game, every country has a passive +2 value and may gain +1 from its Cultural Majority policy. Locations that have a higher population are harder to assimilate while those with a smaller population are easier (this is a restriction from vanilla, unfortunately). Stack modifiers to make this number go up. Higher population growth makes assimilation harder while death, disease, warfare, etc. are all opportunities for minority populations to decline. The strategy to spread your culture is to cultivate your [primary_culture|e], Send Settlers where appropriate with cabinet actions and maximise modifiers, or otherwise just accept cultural diversity."
 icd_intro_event.4.title: "Changes to Tribesmen"
 icd_intro_event.4.desc: "Tribesmen no longer impact control, instead they reduce cultural assimilation speed, crown power and integration speed. They get an Age of Renaissance upgrade to their tribal levy, and new estate privileges. They are harder to get rid of in certain environments without the Promote Tribesmen cabinet action - jungles, mountains, deserts, etc.. Pops of Romani, Baltic or Merya culture do not form a tribal estate due to the nature of their relationship to the state.\n\nTribal levies will not be part of the powerful Tribal Cavalry levy if they are recruited from jungles, tropical forests or areas with arctic climate."
 icd_intro_event.5.title: "Changes to the Reformation"
 icd_intro_event.5.desc: "The Reformation is slower but also stronger and more consistent. Locations where the Reformation passes through get a ‘Religious Zeal’ modifier that makes religious conversion impossible for up to 35 or 45 years.\n\nThe Radical Reformation has also been added, with the [ShowReligionAdjective('anabaptist')] and [ShowReligionAdjective('unitarian')] faiths. The [ShowReligionAdjective('anabaptist')]s have a small movement, but it is weak. The Unitarians spawn only in Poland and Transylvania and lack a movement.\n\nTo resist the Reformation, the best course of action is to outlast it by using Jesuits and the ‘Promote Counter-Reformation’ cabinet action, and strike back only once it has worn itself out. Embracing and promoting the Reformation involves converting as many of your pops as fast as possible, as that boosts its spread.\n\nIf using the new religious mechanics, the Reformation gives a huge boost to the conversion of Catholics and Protestants around the year 1565. This boost lasts 100 years. [forced_conversion|e] also does not upset pops during the Reformation."
 icd_intro_event.6.title: "Changes to specific religions"
 icd_intro_event.6.desc: " - New religions added: [ShowReligionName('southern_mahayana')], [ShowReligionName('anabaptist')], [ShowReligionName('unitarian')], [ShowReligionName('alawite_religion')], [ShowReligionName('nusantaran_hindu')], [ShowReligionName('hyang_religion')], [ShowReligionName('malay_folk_religion')]\n - [ShowReligionName('sanjiao')] has access to unique religious aspects\n - [ShowEstateTypeName('dhimmi_estate')] can be chosen by Muslim countries via the ‘Status of the Dhimmi’ action\n - New religious aspects to Protestants"