 icd_reformation_push.2.title: "Secularisation of the Order"
 icd_reformation_push.2.entry: "Secularisation of the Order"
 icd_reformation_push.2.desc: "The spread of [ShowReligionName('lutheran')] across Germany has raised questions regarding the future of our Order. No longer surrounded by pagans that need to be converted, our role in Catholicism has been questioned even by our own knights. In order to retain control and authority over our territory, perhaps a break with our past might be necessary. [GetCharacter('martin_luther').GetName] has recently advised [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName] that a wise solution would be to convert to [ShowReligionName('lutheran')] and to secularise our state into a monarchy. This would put our relationship with [GetCountry('LIV').GetName] at risk, however."
 icd_reformation_push.2.a: "We will be an Order no longer!"
 icd_reformation_push.2.b: "A ridiculous proposition"
 icd_livonians_will_decide: "[GetCountry('LIV').GetName] will have to decide what to do"
 icd_reformation_push.3.title: "Teutonic Secularisation"
 icd_reformation_push.3.desc: "News has reached us that the Teutons have become the state of [GetCountry('PRU').GetName], after having decided to secularise and convert to [ShowReligionName('lutheran')]. This puts us in a conundrum, as we face similar questions regarding our Order's continued existence as a military order without heathen neighbours to convert. We should decide whether to follow a similar path to them, or to retain our roots and permanently sever our relationship. Choosing the latter might put us at risk, squashed between hostile neighbours"
 icd_reformation_push.3.a: "We will be an Order no longer!"
 icd_reformation_push.3.b: "We are Catholic, first and foremost"
 icd_reformation_push.3.c: "We will be an Order no longer but the Teutons have no say in our future"
 icd_reformation_push.4.title: "Secularisation"
 icd_reformation_push.4.desc: "Our conversion to Protestantism has proven somewhat incompatible with our nature as a theocracy. Without the institutions and legitimacy provided by the Catholic Church, it might be better to secularise our territories and adopt a more definite monarchical organization." 
 icd_reformation_push.4.a: "Secularise now!"
 icd_reformation_push.4.b: "We will be a Protestant theocracy"
 icd_reformation_push.5.entry: "Surrounded by Protestants"
 icd_reformation_push.5.title: "Surrounded by Protestants"
 icd_reformation_push.5.desc: "The conversion away from [ShowReligionName('catholic')] by [GetCountry('DEN').GetName] and [GetCountry('SWE').GetName] has proven to have been quite successful. It is perhaps in our interest to follow suit and adopt a new faith."
 icd_reformation_push.5.a: "Embrace [ShowReligionName('lutheran')]"
 icd_reformation_push.5.b: "Embrace [ShowReligionName('calvinist')]"
 icd_reformation_push.5.c: "We are not interested"
 icd_reformation_push.6.entry: "The Confessor"
 icd_reformation_push.6.title: "The Confessor"
 icd_reformation_push.6.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] has great fondness for the now Protestant city of [ShowLocationName('wittenberg')] after having visited there in earlier years and personally knows many acquaintances of [GetCharacter('martin_luther').GetName] from there. Perhaps due to this, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has proven somewhat sympathetic to [ShowReligionName('lutheran')] and has shown an interest in adopting it as a state religion."
 icd_the_confessor: "the Confessor"
 icd_reformation_push.6.b: "Not interested"
 icd_reformation_push.7.title: "Zeal Dies Down"
 icd_reformation_push.7.desc: "The strong religious zeal caused by the [ShowSituationName('reformation')] in our territory has died down. Previously, this zeal had made attempts at converting people by the state impossible. It is now a possibility for us."
 icd_reformation_push.7.a: "Great"
 icd_reformed.1.title: "Andreas Karlstadt"
 icd_reformed.1.desc: "One of [GetCharacter('martin_luther').GetName]'s most astute allies has proven to be [GetCharacter('icd_reformer_andreas_karlstadt').GetName]. A respected theologian in his own right, Andreas has begun promoting the Reformation against what he sees as a corrupt Church."
 icd_reformed.3.title: "Severed Ties"
 icd_reformed.3.desc: "Despite having defended [GetCharacter('martin_luther').GetName] in the Leipzig Debate and afterwards, [GetCharacter('icd_reformer_andreas_karlstadt').GetName] has unequivocally broken with [GetCharacter('martin_luther').GetName] and adopted a theology now largely seen as radical by him. Andreas has begun to ask to be called 'Brother Andreas', refuses to use anything other than peasant clothing, calls for iconoclasm and has begun promoting positions more aligned with the [ShowReligionAdjective('calvinist')] tradition and the Zwickau Prophets."
 icd_reformed.3.a: "Good for him"
 icd_reformed.3.b: "Has he heard about [ShowReligionName('anabaptist')]?"
 icd_reformed.5.title: "Preachers of Strassburg"
 icd_reformed.5.desc: "Our city of [ShowLocationName('strasbourg')] has stood out in recent weeks as a city where a large number of Protestant preachers have begun to operate. Belonging to various different theological traditions, two stand out for their relevance. [GetCharacter('icd_matthaus_zell').GetName] is a proponent of [ShowReligionName('lutheran')] and, after his recent marriage, his wife has become the first citizen of [ShowLocationName('strasbourg')] to marry a priest. [GetCharacter('icd_martin_bucer').GetName] has played an important role as a mediator between [ShowReligionName('lutheran')] and [ShowReligionName('calvinist')], though he leans more towards [ShowReligionAdjective('calvinist')]."
 icd_reformed.5.a: "Interesting"
 icd_reformed.8.title: "Reception to Protestantism"
 icd_reformed.8.desc: "Since [GetCharacter(icd_caspar_schwenckfeld).GetName] began preaching in our territory, he has been largely successful in spreading the [ShowReligionAdjective('lutheran')] faith. Recently, his preaching has reached even our court, with many being increasingly sympathetic to [ShowReligionName('lutheran')]."
 icd_reformed.8.a: "Perhaps we should embrace [ShowReligionName('lutheran')]."
 icd_reformed.8.b: "This is not of interest to us"
 
 icd_munster_radicals_gather_tt: "Some [pops|e] will become [ShowReligionAdjective('anabaptist')] radicals."
 icd_munster_radicals_gather_more_tt: "Many [pops|e] will become [ShowReligionAdjective('anabaptist')] radicals."
 
 icd_reformation_push.8.title: "Novel Rejections of Catholicism"
 icd_reformation_push.8.desc: "The outbreak of the [ShowSituationName('reformation')] has brought about new rejections of [ShowReligionName('catholic')] that have broken away from the institution, as we once did. These new religions bring new insights into the world. We could allow them to spread in our territory, or we could openly reject and oppose any attempts at changing our existing faith."
 icd_reformation_push.8.a: "We want nothing to do with them"
 icd_reformation_push.8.b: "Let's see what they have to say"
 icd_reformation_push.9.title: "Calvin's Influence"
 icd_reformation_push.9.desc: "[GetCharacter('john_calvin').GetName] has proven to be quite skilled at gathering support among our people. He has succeeded in convincing the government to pass the Ordonnances ecclésiastiques, defining ministerial functions, and has begun to lobby changes to the Civil Edicts. Together, these acts would effectively transform our state into a [ShowReligionAdjective('calvinist')] nation.\n\nOpposing him, a group of individuals from wealthy and powerful families calling themselves the Spirituels, have also began to try to wrestle authority in their favour, with the end goal of exiling [GetCharacter('john_calvin').GetName] if possible."
 icd_reformation_push.9.a: "[GetCharacter('john_calvin').GetName] triumphs against the opposition"
 icd_reformation_push.9.b: "[GetCharacter('john_calvin').GetName] gets exiled"
 icd_reformation_push.9.c: "It is a stalemate"
 icd_reformation_push.10.title: "The Academy of Geneva and Missionary Work"
 icd_reformation_push.10.desc: "After successfully converting our state, [GetCharacter('john_calvin').GetName] now looks to spread his religion through education and external actions. He plans on structuring an Academy of Geneva, as a seminary focused on educating civil officials for our state and pastors, and to direct some of these educated clerics to perform proselytising missions in [GetCountry('FRA').GetName]."
 icd_reformation_push.10.a: "Sounds like a good idea"
 icd_reformation_push.10.b: "And risk angering the French? No way"
 icd_reformed.10.title: "The Reformer [GetCharacter('icd_caspar_olevian').GetName]"
 icd_reformed.10.desc: "A recent arrival in our lands is [GetCharacter('icd_caspar_olevian').GetName], a [ShowReligionAdjective('calvinist')] theologian who has begun to promote Calvin's teachings over those of [ShowReligionName('lutheran')]. Should we welcome him into our territory and possibly give him a post in a local university, it might signal a significant shift in our population's religious beliefs."
 icd_reformed.10.a: "Welcome him with open arms"
 icd_reformed.10.b: "He has no business here"
 
 icd_conversion_events.2.title: "Islamic Pressure"
 icd_conversion_events.2.desc: "Our [ShowReligionAdjective('tengri')] faith has been challenged by the more coherent organization of [ShowReligionGroupName('muslim')]. Some [ShowReligionAdjective('sunni')] scholars and leaders in our society pressure our state and come to our court consistently, seeking to make our ruler convert and accept this new faith."
 icd_conversion_events.2.a: "Ridiculous!"
 icd_conversion_events.2.b: "These [ShowReligionGroupAdjectiveWithNoTooltip('muslim')]s may have a point"
 icd_conversion_events.3.title: "Buddhist Missionaries"
 icd_conversion_events.3.desc: "Lamas have arrived in our country, passing on teachings of the Buddha and spreading mystical techniques. In our court, they have proven quite influential and many have begun to question our exclusive commitment to our [ShowReligionAdjective('tengri')] faith, instead suggesting we should adopt the lamas' [ShowReligionAdjective('tibetan_buddhism')] religion."
 icd_conversion_events.3.a: "Ridiculous!"
 icd_conversion_events.3.b: "These [ShowReligionAdjectiveWithNoTooltip('tibetan_buddhism')]s may have a point"
 icd_conversion_events.3.c: "What do the monks from neighbouring China have to say?"
 