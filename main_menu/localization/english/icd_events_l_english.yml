l_english:
 icd_minority_events.10.title: "Question of the Moriscos"
 icd_minority_events.10.desc: "Though many [ShowCultureNameWithNoTooltip('andalusi')] in our nation have converted to our faith, some of our advisors still suspect that they hold secret [ShowReligionGroupAdjective('muslim')] convictions and a potential loyalty to foreign states. Their insistence to continue using Arabic as a language and their unique identity are both seen as clear evidence of this. In order to ensure the integrity and security of our state, we could expel them as a solution. Or we could simply accept their existence."
 icd_minority_events.10.a: "Expel them!"
 icd_minority_events.10.b: "They can stay"
 
 flavor_cas.1002.title: "Conversion of the Mudéjar"
 flavor_cas.1002.desc: "After our conquest of [ShowAreaName('granada_area')] and [ShowAreaName('andalusia_area')] we are faced with a significant population of [ShowCultureName('andalusi')] and [ShowReligionGroupAdjective('muslim')] people as our subject. The Inquisition has already started the expansion of its activities in the area to ensure the conversion of the people can proceed without issues. Unless [target_character.GetName] intervenes personally against the inquisition, this would ensure the conversion of most of the [ShowCultureNameWithNoTooltip('andalusi')] people, while those who refuse conversion would be expelled from the country."


 icd_reapply_promoting.1.title: "reapply"
 icd_reapply_promoting.1.desc: "reapply"
 icd_reapply_promoting.1.a: "reapply"

 icd_minority_events.1.title: "Flight of the Jewish"
 icd_minority_events.1.desc: "The lack of protection afforded to the [ShowReligionAdjectiveWithNoTooltip('judaism')] population of our state has led to many of them fearing for their lives and way of life. The anxiety and tensions between them and the rest of our population has led to some [ShowReligionAdjectiveWithNoTooltip('judaism')] families to consider even fleeing from our lands. To avoid public chaos, it is apparent we must take a stand on this issue, but there is considerable disagreement on whether it would be best to simply expel them once and for all or to grant them legal protections."
 icd_minority_events.1.a: "Grant them protection!"
 icd_minority_events.1.b: "Perhaps they should be expelled"
 
 icd_minority_events.2.title: "Protections to the [ShowEstateTypeName('dhimmi_estate')]?"
 icd_minority_events.2.desc: "Representatives of the [ShowEstateTypeName('dhimmi_estate')] have recently come to our court detailing the religious discrimination and persecution they have faced by both officers of our state and commonfolk. Some see these attitudes as going against the principles of [ShowReligionGroupName('muslim')] and have argued that we should extend to the [ShowEstateTypeName('dhimmi_estate')] the protections they deserve. Should we do this, however, we may find ourselves ineffective at converting them."
 icd_minority_events.2.a: "Grant religious protection to our [ShowReligionAdjectiveWithNoTooltip('judaism')] and [ShowReligionGroupAdjectiveWithNoTooltip('christian')] subjects!"
 icd_minority_events.2.b: "There is no harm in spreading our word"
 icd_minority_events.3.title: "Identity of the Sabians"
 icd_minority_events.3.desc: "The Sabians are a religious group mentioned in the Quran who supposedly belong to the [ShowEstateTypeName('dhimmi_estate')] and, as such, are a people deserving of full protection under Sharia law. Though there is some question about their true identity, members of our [ShowReligionAdjective('mandeaism')] have come to us claiming that they are, in fact, the Sabians and belong to the category of People of the Book. If that is the case, this would make the [ShowReligionAdjective('mandeaism')] deserving of the same religious protections we afford the other People of the Book."
 icd_minority_events.3.a: "They are the Sabians and deserve to be protected!"
 icd_minority_events.3.b: "This is a falsehood, they are nothing but heathens"
 
 icd_minority_events.4.title: "Violence against the Jewish"
 icd_minority_events.4.desc: "Outbreaks of violence and religious persecution have been taking place in our country, with [ShowReligionAdjectiveWithNoTooltip('judaism')] people as their targets. Such outbreaks strongly contrast with the liberties and protections we have thus far afforded these [ShowReligionAdjectiveWithNoTooltip('judaism')] subjects. With these protections forcing our government to defend these Jewish heathens from the people of our faith, questions have arisen regarding the legitimacy of these privileges to begin with. The risk of the escalation of hatred against the [ShowReligionAdjectiveWithNoTooltip('judaism')] translating into hatred against our government suggests that we should perhaps revoke these protections and let the [ShowReligionAdjectiveWithNoTooltip('judaism')] fight for their lives by themselves."
 icd_minority_events.4.a: "We shall continue protecting our [ShowReligionAdjectiveWithNoTooltip('judaism')] population"
 icd_minority_events.4.b: "The [ShowReligionAdjectiveWithNoTooltip('judaism')] can fend for themselves"
 
 icd_minority_events.5.title: "An Invitation to the Jewish"
 icd_minority_events.5.desc: "The [ShowReligionAdjectiveWithNoTooltip('judaism')] populations of some of our neighbours has proven itself to be quite valuable economically and culturally. As they face the threat of violence and religious persecution in those territories, perhaps it would be an interesting idea to preemptively grant all [ShowReligionAdjectiveWithNoTooltip('judaism')] people protections in the hopes that they flee from those lands to our state, with their expertise and knowledge."
 icd_minority_events.5.a: "Invite a small number of them and grant them protection!"
 icd_minority_events.5.b: "They will never be welcome here"
 
 
 
 icd_minority_events.1001.title: "Flight of the [ROOT.GetVariable('icd_expel_origin_country').GetCountry.MakeScope.GetVariable('icd_expel_culture_people').GetCulture.GetNameWithNoTooltip] People" 
 icd_minority_events.1001.desc: "[ROOT.GetVariable('icd_expel_origin_country').GetCountry.GetFullName] have begun to threaten their [ROOT.GetVariable('icd_expel_origin_country').GetCountry.MakeScope.GetVariable('icd_expel_culture_people').GetCulture.GetNameWithNoTooltip] population, and they appear to be planning to expel these people in great numbers. It is likely that any [ROOT.GetVariable('icd_expel_origin_country').GetCountry.MakeScope.GetVariable('icd_expel_culture_people').GetCulture.GetNameWithNoTooltip] refugees will seek to enter our state due to our cultural proximity. The question is, of course, whether we should accept them at all or not."
 icd_minority_events.1001.a: "Welcome these people!"
 icd_minority_events.1001.b: "We won't be welcoming anyone"
 icd_minority_events.1002.title: "No Home for the [ROOT.GetVariable('icd_expel_culture_people').GetCulture.GetNameWithNoTooltip] People"
 icd_minority_events.1002.desc: "It seems our attempts to expel the [ROOT.GetVariable('icd_expel_culture_people').GetCulture.GetName] people will most likely end in failure as no states in our diplomatic network seem willing or able to receive them. For now, they will have to remain as our subjects."
 icd_minority_events.1002.a: "So be it"
 icd_minority_events.1003.title: "Expelling the [ROOT.GetVariable('icd_expel_culture_people').GetCulture.GetNameWithNoTooltip] People"
 icd_minority_events.1003.desc: "Our preparations are complete, the time has come for us to expel the [ROOT.GetVariable('icd_expel_culture_people').GetCulture.GetName] people from our territory. Though we may not be sucessful in expelling all of them at once, we will make sure to drive off a considerable number of them for at least two years."
 icd_minority_events.1003.a: "Let us begin"
 icd_minority_events.1003.b: "On second thought, this is a bad idea"
 
 
  
 
 icd_dhimmi_communities_each_israelite_custom: "[ShowReligionGroupName('israelite_group')] [pops|e] are currently part of the [ShowEstateTypeName('dhimmi_estate')]"
 icd_dhimmi_communities_each_christian_custom: "[ShowReligionGroupAdjective('christian')] [pops|e] are currently part of the [ShowEstateTypeName('dhimmi_estate')]"
 icd_dhimmi_communities_each_sabian_custom: "[ShowReligionGroupAdjective('mandean_group')] and [ShowReligionGroupAdjective('manichaean_group')] [pops|e] are currently part of the [ShowEstateTypeName('dhimmi_estate')]"
 icd_dhimmi_communities_each_iranic_custom: "[ShowReligionGroupAdjective('zoroastrian_group')] [pops|e] are currently part of the [ShowEstateTypeName('dhimmi_estate')]"
 icd_dhimmi_communities_each_dharmic_custom: "[ShowReligionGroupAdjective('dharmic')] [pops|e] are currently part of the [ShowEstateTypeName('dhimmi_estate')]"
 icd_dhimmi_communities_each_buddhist_custom: "[ShowReligionGroupAdjective('buddhist')] [pops|e] are currently part of the [ShowEstateTypeName('dhimmi_estate')]"
 
 icd_minority_events.7.title: "Status of the Dhimmi"
 icd_minority_events.7.desc: "We may choose which [religions|e] should be considered part of the [ShowEstateTypeName('dhimmi_estate')]. Members of the [ShowEstateTypeName('dhimmi_estate')] are protected from conversion and are afforded autonomy and certain rights, but in exchange must pay the jizya tax and are bound by several restrictions in their day-to-day life.\n\nIn societies with low [tolerance|e], the [ShowEstateTypeName('dhimmi_estate')] experience greater protections and liberties than other [heathens|e]. In societies with high [tolerance|e], the condition of being a [ShowEstateTypeName('dhimmi_estate')] is discriminatory. The position of [ShowEstateTypeName('dhimmi_estate')] can be used either as a tool of repression, or as a tool of promoting religious tolerance. The extent to which protections are in place depends on the [ShowEstateTypeName('dhimmi_estate')] [estate|e]'s privileges. Currently protected [religions|e]:\n\n[ROOT.GetCountry.Custom('icd_dhimmi_communities_each_israelite')]\n[ROOT.GetCountry.Custom('icd_dhimmi_communities_each_christian')]\n[ROOT.GetCountry.Custom('icd_dhimmi_communities_each_sabian')]\n[ROOT.GetCountry.Custom('icd_dhimmi_communities_each_iranic')]\n[ROOT.GetCountry.Custom('icd_dhimmi_communities_each_dharmic')]\n[ROOT.GetCountry.Custom('icd_dhimmi_communities_each_buddhist')]"
 
 
 icd_minority_events.7.a: "Change the status of Jews and Samaritans"
 icd_israelite_dhimmi_remove_tt: "Removes [ShowReligionGroupAdjective('israelite_group')] [pops|e] from the [ShowEstateTypeName('dhimmi_estate')].\nChanges regarding this will usually only take effect after the beginning of February."
 icd_israelite_dhimmi_add_tt: "Brings [ShowReligionGroupAdjective('israelite_group')] [pops|e] into the [ShowEstateTypeName('dhimmi_estate')]\nChanges regarding this will usually only take effect after the beginning of February."
 icd_minority_events.7.b: "Change the status of the Christians"
 icd_christian_dhimmi_remove_tt: "Removes [ShowReligionGroupAdjective('christian')] [pops|e] from the [ShowEstateTypeName('dhimmi_estate')]\nChanges regarding this will usually only take effect after the beginning of February."
 icd_christian_dhimmi_add_tt: "Brings [ShowReligionGroupAdjective('christian')] [pops|e] into the [ShowEstateTypeName('dhimmi_estate')]\nChanges regarding this will usually only take effect after the beginning of February."
 icd_minority_events.7.c: "Change the status of the Sabians"
 icd_sabian_dhimmi_add_tt: "Brings [ShowReligionGroupAdjective('mandean_group')] and [ShowReligionGroupAdjective('manichaean_group')] [pops|e] into the [ShowEstateTypeName('dhimmi_estate')]\nChanges regarding this will usually only take effect after the beginning of February."
 icd_sabian_dhimmi_remove_tt: "Removes [ShowReligionGroupAdjective('mandean_group')] and [ShowReligionGroupAdjective('manichaean_group')] [pops|e] from the [ShowEstateTypeName('dhimmi_estate')]\nChanges regarding this will usually only take effect after the beginning of February."
 icd_minority_events.7.e: "Change the status of the Magians"
 icd_iranic_dhimmi_add_tt: "Brings [ShowReligionGroupAdjective('zoroastrian_group')] [pops|e] into the [ShowEstateTypeName('dhimmi_estate')]\nChanges regarding this will usually only take effect after the beginning of February."
 icd_iranic_dhimmi_remove_tt: "Removes [ShowReligionGroupAdjective('zoroastrian_group')] [pops|e] from the [ShowEstateTypeName('dhimmi_estate')]\nChanges regarding this will usually only take effect after the beginning of February."
 icd_minority_events.7.f: "Change the status of Hindus, Jains and Sikh"
 icd_dharmic_dhimmi_add_tt: "Brings [ShowReligionGroupAdjective('dharmic')] [pops|e] into the [ShowEstateTypeName('dhimmi_estate')]\nChanges regarding this will usually only take effect after the beginning of February."
 icd_dharmic_dhimmi_remove_tt: "Removes [ShowReligionGroupAdjective('dharmic')] [pops|e] from the [ShowEstateTypeName('dhimmi_estate')]\nChanges regarding this will usually only take effect after the beginning of February."
 icd_minority_events.7.g: "Change the status of the Buddhists"
 icd_buddhist_dhimmi_add_tt: "Brings [ShowReligionGroupAdjective('buddhist')] [pops|e] into the [ShowEstateTypeName('dhimmi_estate')]\nChanges regarding this will usually only take effect after the beginning of February."
 icd_buddhist_dhimmi_remove_tt: "Removes [ShowReligionGroupAdjective('buddhist')] [pops|e] from the [ShowEstateTypeName('dhimmi_estate')]\nChanges regarding this will usually only take effect after the beginning of February."
 icd_minority_events.7.h: "Nevermind"
 
 icd_remove_dhimmi_tt: "If our [tolerance|e] of [heathens|e] is below 0, every [pop|e] belonging to the impacted [religion|e] will lose #color_red 15.00%#! [pop_satisfaction|e]"
 
 
 icd_minority_events.31.title: "Leadership in the Levant"
 icd_minority_events.31.desc: "Nestled in the mountains of Lebanon and Jabal al-Druze, our [ShowReligionGroupAdjective('druze_group')] and [ShowReligionAdjective('shia')] subjects have their own societal and political structure. If we seek to procure the aid of these locals and effectively levy support from them, we should recognise the political reality of their homes and grant hereditary dynastic iqta appointments to them."
 icd_minority_events.31.a: "Recognise the power of the local dynasties"
 icd_minority_events.31.b: "These people are apostates and deserve no political authority"
 
 icd_romani_events.99.title: "Arrival of a Different People"
 icd_romani_events.99.desc: "Local authorities have reported the arrival of a distinct group of people into our lands, speaking a strange tongue. Some say they are Tatars, others that they are Egyptians, while others refer to them as cingane or $romani_culture$. Regardless, the reality is that these people appear to be destitute and seem to have fled exploitation in some of our neighbouring countries. Already, our [estates|e] expect us to implement similar laws, treating them as either slaves or unwanted folk, and they will not be pleased if we fail to abide."
 icd_romani_events.99.a: "They may be owned as slaves by the nobility and the Crown"
 icd_romani_events.99.b: "They are to be separated from society and the common folk"
 icd_romani_events.99.c: "Let us take advantage of what skills they have"
 icd_romani_events.99.d: "Expel these outlandish people!"
 icd_romani_events.99.e: "They are to be treated with fairness and justice, as any other man"
 icd_romani_events.90.title: "Settlements of Romani"
 icd_romani_events.90.desc: "By whatever circumstances, we are now the sovereigns of a distinct people who have come to be known as the $romani_culture$. As this is an unprecedented situation, we must decide what to do with these folk. Some of our neighbours have already implemented laws that exploit them and treat them as an unwanted people; it seems our [estates|e] expect us to implement similar legislation. Should we refuse and attempt to favour or integrate them socially, this will not be well-received."

  
 icd_romani_events.4.title: "A Promising Romani Advisor"
 icd_romani_events.4.desc: "A member of the $romani_culture$ community, [SCOPE.sCharacter('icd_romani_cabinet_scope').GetName] has stood out for rising above his lot in life and proving himself quite influential in court. However, his position is not without its critics - many other members of the court feel threatened by his presence and believe it is a threat. We could support this talented individual, or have him gone so as not to destabilise our rule."
 icd_romani_events.4.a: "Support such talents!"
 icd_romani_events.4.b: "He has no place in our court"
 icd_romani_events.5.title: "A Painting of the Romani"
 icd_romani_events.5.desc: "Our artist [SCOPE.sCharacter('icd_painting_artist_scope').GetName] has become inspired by scenes of the $romani_culture$ community in our country, and has been planning a large painting depicting their way of life. Should we support such a painting, it will provide a valuable addition to our galleries."
 icd_romani_events.5.a: "Paint it!"
 icd_romani_events.5.b: "It isn't worth the investment"
 icd_romani_events.6.title: "the King of the Gypsies"
 icd_romani_events.6.desc: "Among the $romani_culture$, a man by the name of [SCOPE.sCharacter('icd_romani_king_gypsy_scope').GetName] has stood out for his leadership and authority. He has begun taking on the title of 'King of the Gypsies', and has assumed an important role in the relationship and ties between $romani_culture$ and non-Romani in both the professional and political spheres. Should we recognise his position formally, we may inevitably profit."
 icd_king_of_the_gypsies_nickname: "King of the Gypsies"
 icd_romani_events.6.a: "He is a true king!"
 icd_romani_events.6.b: "We will have no part in this farse"
 icd_romani_events.7.title: "The Rise of Stefan Răzvan"
 icd_romani_events.7.entry: "The Rise of Stefan Răzvan"
 icd_romani_events.7.desc: "The strategic brilliance and political charisma of [ROOT.GetVariable('icd_stefan_razvan_variable').GetCharacter.GetName] have proven very impressive, and despite his origins as a $romani_culture$, he has risen in society and achieved great success as a member of the [ShowEstateTypeName('nobles_estate')]. In particular, he has stood out for his strong relationship with $moldovan_culture$ common folk even outside our territory. In these difficult times, where our ruler has failed to maintain political authority, perhaps we should consider giving some degree of military and political influence to such a charismatic individual. Though the risk always exists that he uses said power and his popularity to further destabilise our rule."
 icd_romani_events.7.a: "Talent must be recognised!"
 icd_romani_events.7.b: "Have him quietly dispatched"
 icd_romani_events.8.title: "Stefan Răzvan's Ascension"
 icd_romani_events.8.desc: "[ROOT.GetVariable('icd_stefan_razvan_variable').GetCharacter.GetName] has proven himself a cultured and influential person, and has managed to create a following among our nobles and subjects. Many have even begun to see our ruler [SCOPE.sCharacter('icd_our_ruler_versus_stefan').GetName] as comparatively incapable and weak. The time perhaps has come for a change in leadership. Stefan's ties and relations beyond our borders will be of equal importance in ensuring his success as a leader."
 icd_romani_events.8.a: "The time has come for a change in leadership"
 icd_romani_events.8.b: "Have this man executed at once!"
 
 icd_romani_events.9.title: "A Threatening Leader"
 icd_romani_events.9.desc: "Our ruler, [ROOT.GetCountry.GetGovernment.GetRuler.GetName], has proven popular amongst the populace not only in our borders but beyond. [ROOT.GetCountry.GetGovernment.GetRuler.GetHisHer|U] fierce rallying of the local peoples has proven threatening to [SCOPE.sCountry('icd_big_country_will_invade').GetName] who have begun to argue that [ROOT.GetCountry.GetGovernment.GetRuler.GetName] and [ROOT.GetCountry.GetGovernment.GetRuler.GetHisHer] dynasty are illegitimate usurpers with no right to rule. They propose to restore proper governance in our borders. We risk a military intervention should things continue like this."
 icd_romani_events.9.a: "Perhaps the nobles can sort this issue out by themselves"
 icd_romani_events.9.b: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] will not be threatened"
 
 icd_romani_events.95.title: "Status of the Romani"
 icd_romani_events.95.desc: "As we have removed the recent restrictions on the $romani_culture$, we must consider a change in policy and approach. What position should we adopt in relation to them?"
 
 
 icd_muslim_events.1.title: "Conversion of the Bosnians"
 icd_conversion_events.1.entry: "Conversion of the Bosnians"
 icd_muslim_events.1.desc: "The faithfulness of the $bosnian$s to local religions is surprisingly shallow. Historical competition between [ShowReligionName('catholic')] and [ShowReligionName('orthodox')] in Bosnia has weakened the religious fabric of society there and led to a lack of clerical and spiritual organization. Allowed to exist thanks to this vaccuum, the schismatic [ShowReligionAdjective('bosnian_church')], however, failed to create a stronger alternative. With our arrival and conquest of these lands, the local people have appeared surprisingly open to [ShowReligionGroupName('muslim')] and seem to be willing to convert and commit to our faith. If we begin proselytising efforts among them, we will be sure to see a large number of converts."
 icd_muslim_events.1.a: "Spread the word to the $bosnian$s"
 icd_muslim_events.1.b: "And lose a source of jizya tax? Never"
 
 icd_minority_events.9.title: "Expel the Crimeans?"
 icd_minority_events.9.desc: "The presence of the [ShowCultureName('crimean')] people in our territory has proven to be a hinderance to our ambitions of taming the Steppes, and a source of conflict and disharmony. Their wildly different traditions and beliefs, and their nomadic heritage prove difficult for us to control. We are faced increasingly with having to make a decision on whether we should continue allowing these people to live in our lands by seeking to accept them into our society, or if we should expel them promptly.\n\nIf we do expel them, they will likely see us and our institutions as enemies, and we should be warned that all our efforts to convert them to our faith will have been wasted."
 icd_minority_events.9.a: "Expel them!"
 icd_minority_events.9.b: "Let them remain"
 
 icd_minority_events.1.c: "Implement restrictions and separation on the Jewish!"
 icd_minority_events.4.c: "Implement restrictions and separation on the Jewish!"
 icd_minority_events.8.title: "Outbreak of Religious Violence"
 icd_minority_events.8.desc: "The large number of [ShowReligionAdjective('judaism')] people in our lands has lead to the spread of lies and conspiracies about them, and the rise of religious violence against the [ShowReligionAdjective('judaism')] community. If we do not act now, we risk seeing the outbreak of a very bloody pogrom against the [ShowReligionAdjective('judaism')]."
 icd_minority_events.8.a: "There isn't much we can do"
 icd_minority_events.8.b: "We must act now!"
 flavor_eng.7.fallback_title: "The souring of relations and attrition between [ROOT.GetCountry.GetName] and the [GetCountry('PAP').GetName] amidst the [ShowSituationName('reformation')] has led to [ROOT.GetCountry.GetGovernment.GetRuler.GetName] forming ideas about a potential separation from the [GetCountry('PAP').GetGovernment.GetRulerTitle]. Should we undergo this religious break, we will be effectively establishing a new religion entirely separate from the Catholic world."
 icd_dhes.2.title: "Cum Nimis Absurdum"
 icd_dhes.2.entry: "Cum Nimis Absurdum"
 icd_dhes.2.desc: "In the past, the [GetCountry('PAP').GetName] and the [GetCountry('PAP').GetGovernment.GetRulerTitle] had been strong in advocating for the protection of Jewish peoples and their property and religious rights. These rights, however, have proven to be incompatible with the Inquisition and practices of religious investigation nowadays - and it is clear that as long as these rights and protections are in place, [ShowReligionAdjective('judaism')] people will have little reason to convert to the true faith. Perhaps a shift in policy might be necessary through a papal bull, revoking all the rights enjoyed by the [ShowReligionAdjective('judaism')], placing economic restrictions on them and forcing them to exist in a state of humiliation, secluded in separate neighbourhoods - ghettos."
 icd_dhes.2.a: "Enact Cum nimis absurdum - they must know their place"
 icd_dhes.2.b: "This would be too cruel"
 icd_dhes.3.title: "The Pope's Cum Nimis Absurdum"
 icd_dhes.3.desc: "The [GetCountry('PAP').GetGovernment.GetRulerTitle]'s decision to enact a papal bull revoking all protections enjoyed thus far by the [ShowReligionAdjective('judaism')] community has profoundly changed the situation of the [ShowReligionAdjective('judaism')] in his lands. Now, the [GetCountry('PAP').GetGovernment.GetRulerTitle] has also begun to pressure us to implement a similar policy, segregating the [ShowReligionAdjectiveWithNoTooltip('judaism')] to ghettos."
 icd_dhes.3.a: "We obey the Papacy"
 icd_dhes.3.b: "The [GetCountry('PAP').GetGovernment.GetRulerTitle] has no right to dictate our policies"
 reformation.2.c: "Does this translation conform to the Geneva Bible?"
 reformation.7.title: "[SCOPE.sCharacter('target_character').GetNameWithNoTooltip]"
 reformation.7.desc: "An influential and fiery reformer, [SCOPE.sCharacter('target_character').GetNameWithNoTooltip], has recently arrived in our territory. A member of the [ShowReligionAdjective('calvinist')] faith, [target_character.GetNameWithNoTooltip] has stood out for his work on elucidating a new and more cohesive theology for the religion, which has so far promised to completely transform it."
 reformation.7.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 icd_radical_reformation.1.title: "Zwickau Prophets"
 icd_radical_reformation.1.desc: "[ShowLocationName('wittenberg')] has recently been caught in an uproar and in the midst of civil unrest, as a group of three individuals from Zwickau, calling themselves the Zwickau Prophets have taken the centerstage. They preach the abandonment of child baptism in favour of believer's baptism and a more radical theology than what [GetCharacter('martin_luther').GetName] and [GetCharacter('reformer_philip_melanchton').GetName] have any liking for. If these 'Prophets' are allowed to preach freely, the town risks a far more radical upheaval than what even [ShowReligionNameWithNoTooltip('lutheran')] preaches."
 icd_radical_reformation.1.a: "[GetCharacter('martin_luther').GetName] will calm the people and denounce the radicals"
 icd_radical_reformation.2.title: "Swiss Brethren and Conrad Grebel"
 icd_radical_reformation.2.desc: "[GetCharacter('swi_conrad_grebel').GetName] is a preacher who has recently stood out for having diverged from [GetCharacter('swi_huldrych_zwingli').GetName] of the [ShowReligionAdjective('calvinist')] faith on matters of theology. [GetCharacter('swi_conrad_grebel').GetName] has advocated for a much more novel approach to Christianity, rejecting child baptism in favour of baptism of adults and the integration of the individual into a larger community of the faithful. His ideas, shared by fellow members of his new religious community - the Swiss Brethren, have found some followers among our people and waves of rebaptism have begun across our territory."
 icd_radical_reformation.2.a: "Promote this novel religion!"
 icd_radical_reformation.2.b: "Exile this fool!"
 icd_radical_reformation.2.c: "We must kill these heretics!"
 icd_radical_reformation.3.title: "Radical Outbreak"
 icd_radical_reformation.3.desc: "A group of people in and around [SCOPE.sLocation('target_this_location').GetName] have begun to embrace [ShowReligionAdjective('anabaptist')] ideas in large numbers, with outbreaks of mass re-baptism and communal prayer."
 icd_radical_reformation.3.a: "This is concerning"
 icd_radical_reformation.4.title: "An Unexpected Conversion"
 icd_radical_reformation.4.desc: "[GetCharacter('icd_caspar_schwenckfeld').GetName] was at one point an extremely important [ShowReligionAdjective('lutheran')] preacher, integral to the spread of [ShowReligionName('lutheran')] to Silesia. Apparently, however, [GetCharacter('icd_caspar_schwenckfeld').GetName] has begun to question [ShowReligionAdjective('lutheran')] theology in recent sermons and has begun to promote ideas more aligned with [ShowReligionName('anabaptist')], to the surprise of many. He has found new followers among our people, who have begun organising around 'Schwenkfeld Churches'."
 icd_radical_reformation.4.a: "It is his right to change his mind"
 icd_radical_reformation.4.b: "Maybe he is right"
 icd_radical_reformation.4.c: "Heresy will not be permitted in our realm"
 icd_radical_reformation.5.title: "The Radical Reformer [GetCharacter('icd_balthazar_hubmaier').GetName]"
 icd_radical_reformation.5.desc: "The Radical Reformation has arrived in our lands! Ideas once considered the gravest of heresies are now being promoted by a recently arrived preacher, [GetCharacter('icd_balthazar_hubmaier').GetName], who spreads news that our subjects listen to carefully." 
 icd_radical_reformation.5.a: "Interesting"
 icd_radical_reformation.5.b: "Perhaps they are right"
 icd_radical_reformation.6.title: "The Reformer [GetCharacter('icd_michael_settler').GetName] and the Schleitheim Confession"
 icd_radical_reformation.6.desc: "[GetCharacter('icd_michael_settler').GetName] has recently finalised the Schleitheim Confession with several other [ShowReligionAdjective('anabaptist')] theologians. The Confession is intended to serve as a representative statement of Anabaptist principles, outlining their theological positions such as adult baptism, Christian pacifism and the organisation of religious communities."
 icd_radical_reformation.6.a: "Alright"
 icd_radical_reformation.7.title: "The Radical Reformer [GetCharacter('icd_jacob_hutter').GetName]"
 icd_radical_reformation.7.desc: "The Radical Reformation has arrived in our lands! Ideas once considered the gravest of heresies are now being promoted by a recently arrived preacher, [GetCharacter('icd_jacob_hutter').GetName], who spreads news that our subjects listen to carefully." 
 icd_radical_reformation.7.a: "Alright"
 icd_radical_reformation.8.title: "The Radical Reformer [GetCharacter('icd_john_hut').GetName]"
 icd_radical_reformation.8.desc: "The Radical Reformation has arrived in our lands! Ideas once considered the gravest of heresies are now being promoted by a recently arrived preacher, [GetCharacter('icd_john_hut').GetName], who spreads news that our subjects listen to carefully." 
 icd_radical_reformation.9.title: "The Radical Reformer [GetCharacter('icd_menno_simons').GetName]"
 icd_radical_reformation.9.desc: "The Radical Reformation has arrived in our lands! Ideas once considered the gravest of heresies are now being promoted by a recently arrived preacher, [GetCharacter('icd_menno_simons').GetName], who spreads news that our subjects listen to carefully." 
 icd_radical_reformation.10.title: "Unitarian Ideas"
 icd_radical_reformation.10.desc: "An adoring fan of radical theology, [GetCharacter('icd_peter_goniadza').GetName] has recently begun to promote a very distinct religious position - nontrinitarianism. Though in the past, heresies had spread similar ideals, this marks the first moment in the [ShowSituationName('reformation')] that this theological position has been so fiercely and strongly defended."
 icd_radical_reformation.10.a: "This might prove a problem"
 icd_radical_reformation.11.title: "The Polish Brethren and Socinianism"
 icd_radical_reformation.11.desc: "Laying on the groundwork created by [GetCharacter('icd_peter_goniadza').GetName], a nontrinitarian religious group known as the Polish Brethren has been established in our society. A recent arrival to this community, [GetCharacter('icd_fausto_sozzini').GetName] has begun to promote a more thorough and structured theology, Socinianism, which has led to the spread of the faith among many followers."
 icd_radical_reformation.11.a: "This is proving to be a problem"
 icd_radical_reformation.12.title: "A Calvinist Preacher"
 icd_radical_reformation.12.desc: "A [ShowReligionAdjective('calvinist')] preacher has recently been elected bishop by the churches of [ShowAreaName('transylvania_area')]. Known as [GetCharacter('icd_ferenc_david').GetName], he has attracted attention for his knowledge and charisma."
 icd_radical_reformation.12.a: "Regardless of his religion, he seems to be a wise man"
 icd_radical_reformation.12.b: "Keep him away!"
 icd_radical_reformation.13.title: "Unitarian Converts"
 icd_radical_reformation.13.desc: "[GetCharacter('icd_ferenc_david').GetName] has shocked our royal court by converting to [ShowReligionName('unitarian')]. He has denied the Trinity and affirmed the singular unity of God as one, with no equal. Already he begins to preach to our people about this heresy."
 icd_radical_reformation.13.a: "Fine"
 icd_radical_reformation.13.b: "He sounds very persuasive"
 icd_radical_reformation.13.c: "We must kill this heretic"
 icd_radical_reformation.14.title: "Edict of Torda"
 icd_radical_reformation.14.desc: "Our subjects from [ShowAreaName('transylvania_area')], with wisdom imparted by [GetCharacter('icd_ferenc_david').GetName], have put forth a novel political suggestion for an edict that would permit all forms of Christianity, including those deemed heretical, to have preachers elected in our territory. Supposedly, this would ease any possible religious conflict in our state."
 icd_radical_reformation.14.a: "Enact this edict of tolerance!"
 icd_radical_reformation.14.b: "This is not of interest to us"
 icd_radical_reformation.20.title: "Rise of the Anabaptists"
 icd_radical_reformation.20.entry: "Rise of the Anabaptists"
 icd_radical_reformation.20.desc: "Apocalyptic preachers associated with [ShowReligionName('anabaptist')] and led by [GetCharacter('icd_bernhard_knipperdolling').GetName] have proven very successful in [ShowLocationName('munster')], attracting large numbers of adherents to their faith. They have even begun to exercise political pressure on the city's local governing body, much to the dismay of our government."
 icd_radical_reformation.20.a: "This is very concerning"
 icd_radical_reformation.21.title: "Strengthening Anabaptists"
 icd_radical_reformation.21.desc: "The [ShowReligionAdjective('anabaptist')] preachers in [ShowLocationName('munster')] have begun finding even larger numbers of converts, creating a messianic movement that sees the city of [ShowLocationName('munster')] as a 'New Jerusalem'. Their numbers have swelled to the point of taking over the local governing institutions, and they have begun to threaten rebellion unless something is done."
 icd_radical_reformation.21.a: "We do not deal with heretics"
 icd_radical_reformation.21.b: "Bribe their leaders, negotiate where possible and subvert local institutions"
 icd_radical_reformation.22.title: "Münster Rebellion"
 icd_radical_reformation.22.desc: "The people of [ShowLocationName('munster')], guided by [ShowReligionAdjective('anabaptist')] ideals, have risen up in revolt. The entire city has declared its separation from our state and has claimed to be a 'New Jerusalem', a holy center with a messianic purpose. They are led by [GetCharacter('icd_jan_matthys').GetName], who is believed to be a prophetic figure with a divine vision."
 icd_radical_reformation.22.a: "It is war!"
 icd_radical_reformation.22.b: "They have a point"
