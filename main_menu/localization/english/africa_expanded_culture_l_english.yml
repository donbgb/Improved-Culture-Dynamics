 manden_group_desc: "The Manding peoples and other closely-related Mandé groups have a shared civilizational and societal heritage, going back to the Tichitt culture in 2200 BCE. These people have largely exchanged power between themselves and share many cultural commonalities, such as an elaborate caste system."
 bisa_busa_group_desc: "The speakers of the Bisa-Busa languages have a shared origin as a Mandé peoples who moved southeast from their homelands, invading territory belonging to very distinct cultures and assimilating some of their traditions."
 west_sudanian_group_desc: "The western regions of the Sudanian savannah and the Sahel are home to peoples with shared cultural traits and which have partaken in a long process of civilization-building, creation of the arts and military conquest."
 upper_guinean_group_desc: "The Upper Guinea straddles the transition from savannah to rainforest. It is a territory of adaptation and a corridor through which many cultures and invading peoples have passed through. Its locals carry cultural characteristics of the peoples of the Sudanian savannah and the Guinean rainforest."
 jallonkadu_group_desc: "The highlands of the Jallonkadu consist mainly of rolling grasslands interspersed by deep jungle valleys. The terrain encourages both cultural dissemination and cultural exclaves, blending different traditions together. The locals are known for both their livestock-tending and their adaptive agriculture."
 senegambian_group_desc: "Along and between the Senegal and Gambia rivers stretches semi-arid plains made fertile in part thanks only to both rivers and their tributaries. This is a region that serves as the main gateway to Sudan, home to closely related speakers of Senegambian languages and a long history of state-building."
 maritime_guinean_group_desc: "Maritime Guinea is a region of coastal plains and forests, indented with drowned river valleys, that form inlets, marshes, mangrove forests, estuaries and dozens small islands. The locals of this land have adapted to a wet environment with a highly-developed agricultural system of rice farming, and share significant cultural similarities between themselves."
 guinean_group_desc: "The humid and dense tropical rainforests of Guinea pose several difficulties to its residents, encouraging the use of similar strategies."
 mole_dagbon_group_desc: "The Mole-Dagbon peoples not only a linguistic group but a cultural one, noticeable for their shared history and identity, similar religious characteristics, interlinked political structures and highly hierarchical social organization."
 gurunsi_group_desc: "Speakers of Gurunsi languages have not only a shared history and shared attitudes but are noticeable in their historical resistance and opposition to Mole-Dagbon rule."
 kwa_group_desc: "Despite straddling different environments encompassing mangrove forests, rainforests and grasslands, speakers of the Kwa languages stand out for the close relationships held between them, both in friendship and emnity." 
 gbe_group_desc: "Speakers of the Gbe languages, huddled around the distinctive Dahomey Gap and surrounding areas, speak very similar languages, cultivate a shared oral history and have similar cultural attitudes."
 yoruboid_group_desc: "Yoruba civilization has not only created a very distinctive form of political, religious and social organization but has been able to export its cultural and religious outlook, influencing neighbouring peoples to also adopt many of their customs as part of a shared ritual sphere."
 lower_niger_group_desc: "Along the lower parts of the Niger River, many people interact and blend into one another, exchanging traditions and elements of belief systems."
 niger_delta_desc: "In the marshy terrain of the Niger Delta, extensive waves of migration and exchange have led to a continuum of distinctive cultures mixed into one another."
 benue_group_desc: "The basin of the Benue River is the center of the multicultural Kwararafa Confederation and has a long history of cultural exchange and resistance to invasions."
 central_sudanian_group_desc: "The central part of the Sudanian savannah is dominated by the Hausa peoples, whose traditional way of life and creation of hundreds of walled citadels known as birnis, have influenced and shaped the culture of neighbouring ethnic groups."
 chadic_group_desc: "The cultures surrounding Lake Chad have a heritage in not only sharing or resisting the same civilizations and Islam, but also constant commerce and trade with the Sahara and a dependence on Lake Chad and the rivers that feed it for their livelihood."
 plateau_group_desc: "The Jos Plateau is a hotpot of multiculturalism, with dozens of small different ethnic groups living side-by-side to one another."
 borgu_group_desc: "A shared history and heritage in the foundation and waves of migration that led to the formation of the Borgu Kingdom unite both the Bariba, with their constituent parts, and the Busa people."
 mandaran_group_desc: "The peoples that surround the Adamawa and Mambila Plateaus are diverse but also share in languages, culture and traditions."
 kru_group_desc: "The speakers of the Kru languages are noticeably very distinctive and unique, having a very particular set of customs, beliefs, traditions and practices."
 niger_delta_group_desc: "The Niger Delta is home to many different peoples."
 bakongo_group_desc: "The Bakongo peoples"
 
 
 worship_ogun_orisha: "Ògún"
 worship_ogun_orisha_desc: "Ògún is the òrìshà of iron, hunting, metalworking, metallurgy, blacksmiths and divine judgement."
 worship_ogun_warrior_orisha: "Ògún"
 worship_ogun_warrior_orisha_desc: "Ògún is the òrìshà of iron, hunting, metalworking, metallurgy, blacksmiths, divine judgement and more recently, of warfare and warriors."
 worship_shango_orisha: "Shàngó"
 worship_shango_orisha_desc: "Shàngó is the òrìshà of fire, thunder, lightning, virility, dance, drumming and strength."
 
 
 
 
 