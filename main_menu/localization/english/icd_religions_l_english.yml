 icd_sufi_order: "Sufi Order"
 icd_sufi_order_desc: "A spiritual brotherhood centered around the pursuit of a closer relationship with God"
 icd_militant_sufi_order: "Militant Sufi Order"
 icd_militant_sufi_order_desc: "A spiritual and hierarchical brotherhood that combines the pursuit for a closer relationship with God with the use of violent struggle."
