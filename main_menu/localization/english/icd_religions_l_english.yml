 rifai_order: "Rifa'i Order"
 mevlevi_order: "Mevlevi Order"
 khalwati_order: "Khalwati Order"
 bektashi_order: "Bektashi Order"
 icd_sufi_mahdist_movement: "Sufi Mahdist Movements"
 icd_civic_calling: "Anjuman"
 icd_civic_calling_desc: "A Sufi order which emphasises the harmony between day-to-day life and spiritual devotion, calling for spiritual awareness in mundane life even amidst groups of people (anjuman), rejecting asceticism or isolation from the world."
 icd_expressive_calling: "Sama"
 icd_expressive_calling_desc: "A Sufi order which emphasises the role of sama - spiritual concerts - in devotion, utilising singing, dancing and movement as a core part of faith."
 icd_internalized_calling: "Samt"
 icd_internalized_calling_desc: "A Sufi order which emphasises the role of samt (silence) and silent dhikr, putting greater focus on inward meditative practices."
 icd_mortifying_calling: "Fana"
 icd_mortifying_calling_desc: "A Sufi order which emphasises fana, or spiritual self-mortification, as a means of connecting with God, upholding more extreme ritual practices and asceticism."
 icd_syncretic_calling: "Tasamuh"
 icd_syncretic_calling_desc: "A Sufi order which emphasises tasamuh, or tolerance, calling for a path to God that transcends religious backgrounds and holds a more universalis ethos."
 icd_mahdist_calling: "Mahdism"
 icd_mahdist_calling_desc: "A militarised apocalyptic Sufi movement, which believes that the Mahdi is either coming soon or has already arrived."
 
 sufi_shiite_messianism: "Sufi-Shiite Messianism"
 sufi_shiite_messianism_desc: "Various Sufi movements which hold Alid sympathies and believe that the end times are coming, with the mahdi soon arriving."
 sufi_shiite_messianism_location_modifier: "Sufi-Shiite Messianism"
 
