l_english:
###the fusion of Huayan,Chan, and esoteric Buddhism became the de facto Buddhism of the Liao and iscalled the “Perfect Teaching” (yuanjiao ⚻㔁). This school traced its origins not tothe standard Huayan teachings of Yunhua Zhiyan (暚厗㘢⃤, 602– 668) andFazang (㱽啷, 643– 712) but to Qingliang Chengguan (ⅲ㵤㼬奨, 737– 838) and the works of his disciple Guifeng Zongmi (⛕Ⲙ⬿⭮, 780– 841)
 alawite_religion: "Alawism"
 alawite_religion_ADJ: "Alawite"
 alawite_religion_desc: "A secretive religion begun by senior disciples of the Twelve Imams, which incorporates Gnostic perspectives into the $shia_ADJ$ faith. The religion maintains a distinct esoteric reading of the Quran, upholding a belief that Sharia law is no longer in effect and that God is present in three manifestations, the last of which incarnated as 'Alī ibn Abī Ṭālib."

 southern_mahayana: "Southern Mahāyāna"
 southern_mahayana_ADJ: "Southern Mahāyāna"
 southern_mahayana_desc: "Southern Mahāyāna refers to related forms of esoteric Mahāyāna Buddhism that originated from $india$ and were brought into Southeast Asia, where they have largely developed new worldviews. Though Southern Mahāyāna possesses many of the fundamentals of other Mahāyāna branches of $buddhist$, such as accepting the texts known as the Mahāyāna $sutra$ alongside early Buddhist texts and putting an emphasis on the figure of the $bodhisattva$, it also has distinct interpretations of esoteric Vajrayāna spiritual awakening practices. The faith is heavily influenced by Tibetan, Burmese and Chinese Buddhism, as well as Hinduism."
 
 nusantaran_hindu: "Nusantaran Hinduism"
 nusantaran_hindu_ADJ: "Nusantaran Hindu"
 nusantaran_hindu_desc: "Rather than a singular religion, $nusantaran_hindu$ refers to similar interconnected Hindu-Buddhist beliefs, practices and traditions that are prevalent in Indonesia. This faith typically incorporates ideals found in both Buddhism and Hinduism, defending a syncretic but hierarchical relationship of both faiths that often subordinates Buddhism to Hindusim. It also heavily incorporates local Indonesian folk beliefs and traditions into both perspectives. Focus is given on the $dharmic$ cosmic order and moksha, as well as on the figure of the Buddha and nirvana - Śiva and Buddha are often equated, for instance. Practicioners typically do not exclusively participate in a particular manifestation of this religion and go to both Buddhist monasteries and Hindu temples, though Buddhist and Hindu clergy are generally separate and compete for royal patronage."
 
 anabaptist: "Anabaptism"
 anabaptist_ADJ: "Anabaptist"
 anabaptist_desc: "Anabaptism is a strand of Christianity, which believes that Christianity should be a consciously chosen faith, shared by a community of faithful that is organised separately from the secular world. Among their beliefs, Anabaptists see baptism as being valid only when the baptised can make a conscious decision and they reject hierarchical priestly structures or state churches. Many Anabaptist groups also practice pacifism, the sharing of goods and seek to live a modest ascetic life."
 
 unitarian: "Unitarianism"
 unitarian_ADJ: "Unitarian"
 unitarian_desc: "Unitarianism is a nontrinitarian strand of Christianity that took shape during the Reformation in Poland and Transylvania primarily. Unitarians maintain that God is one and indivisible, and they see Jesus as a lesser creation of God. Other beliefs may vary, but often include a rejection of the use of violence and an emphasis on the free will of humans."
 
 icd_enable_polygamy: "Enables the [ShowPolicyName('icd_abrahamic_marriage')] [policy|e]"
 
 malay_folk_religion: "Malay"
 malay_folk_religion_ADJ: "Malay"
 malay_folk_religion_desc: "The $malay_folk_religion$ $common_folk_religion_desc$"
 hyang_religion: "Hyang"
 hyang_religion_ADJ: "Hyang"
 hyang_religion_desc: "The $hyang_religion$ $common_folk_religion_desc$"
 
 lixue_school: "Lǐxué School"
 lixue_school_desc: "Lǐxué, also known as the School of Principle, is a philosophical school of Confucianism, which argues that reality is based on an underlying natural order and structure known as li ('principle'). The school rejects ideas such as karma or immateriality, arguing strictly for a rational understanding of reality as driven through laws and structures. It postulates that principle (li) and human nature are originally good and functional frameworks, but are muddled by qi, and only through observational science and investigation can this qi be unwrapped to reveal the underlying goodness of things."
 xinxue_school: "Xīnxué School"
 xinxue_school_desc: "Xīnxué, also known as the School of Heart-mind, is a philosophical school whose origins lie in the work of Lù Jiǔyuān but were organized and expanded only later by Wang Yángmíng. The school postulates that as people deal with the world only through their senses and experiences, the individual can find reality within his consciousness - 'heartmind', and reality is not necessarily external but can be understood internally. As people understand through action, knowing and doing are not separate things but united. Due to this, the school maintains that education and engaging with what one learned are the true paths to understanding the inherent good behind all things."
 yongjia_school: "Yǒngjiā School"
 yongjia_school_desc: "Yǒngjiā, also known as the School of Practice, is a philosophical school that sees all theoretical concerns as requiring a basis through action. Without action, the school argues that theories are just talk and meaningless, and that ideas of righteousness can only be understood if one acts consistently according to them. The school integrates the actions of merchants into this framework, seeing profitable commerce as actions applied with righteous results. Adherents of this school defend free trade, privatization and economic pragmatism above all."
 yongkang_school: "Yǒngkāng School"
 yongkang_school_desc: "Yǒngkāng is a philosophical school that rejects lofty metaphysics and instead reemphasises the desirability and morality of things and actions as solely based on practical concerns. Whether an action is good or not is determined by its consequences rather than its motives or any disconnected metaphysical considerations. In governance, practical concerns regarding a policy's impacts and pragmatic solutions should always be the focus rather than ideals of moral governance."
 kaozhenxue_school: "Kǎozhèngxué School"
 kaozhenxue_school_desc: "Kǎozhèngxué, or 'evidential studies', are a form of scholarship that rejects subjectivism and internal analysis, and instead lean very heavily on areas of evidential study like astronomy, geography, mathematics, philology and rigorous scholarship of past texts. Kǎozhèngxué would later develop into the Hànxué school, with a greater focus on standardised scholarship."
 zhedongxue_school: "Zhèdōngxué School"
 zhedongxue_school_desc: "Zhèdōngxué is a Confucian school almost exclusively focused on historiography, seeing the past as the only means of understanding reality and the present. The school calls for a return to the traditions and a purified understanding of Confucianism based on the ancient texts, rather than later interpretations and additions."
 songnihak_school: "Sŏngnihak School"
 songnihak_school_desc: "Sŏngnihak refers to the Korean interpretation and expansion of the Confucian school of Lǐxué. Sŏngnihak is characterised by its dogmatism and cohesiveness, emphasising an absolute commitment to the ideas of Confucian thinker Zhū Xī."
 silhak_school: "Silhak"
 silhak_school_desc: "Silhak, also known as 'practical studies', refers to a broad reform movement that arose in Korea in response to the supposed uncritical dogmatism of Confucianism there. The school advocates for an empiricism concerned with human society at the practical level rather than excessive metaphysical considerations, arguing for reforming the rigid Confucian social structure, implementing land reforms to relieve the plight of peasant farmers, encouraging the study of science, and advocating technology exchange with foreign countries"
 shenyan_school: "Shènyán"
 shenyan_school_desc: "Shènyán ('Well-Weighed Words'), refers to the work of Wang Tingxiang. Characterised by being heavily unorthodox, the school preaches that qi alone can explain all things in reality, arguing that principle does not exist, and as such, goodness and the predispositions for virtue aren’t necessary features of human nature, but rather responsive to social norms and expectations."
 quanzhen_school: "Quánzhēn"
 quanzhen_school_desc: "Quánzhēn, also known as Complete Perfection, is a branch of Daoism that specializes in internal alchemy and cultivation as the main means of harmonising oneself with the Dao- which should be the ultimate goal of existence."
 zhengyi_dao: "Zhèngyī Dào"
 zhengyi_dao_desc: "Zhèng Yī Dào, also known as the Way of Orthodox Unity, is a branch of Daoism that is notable for its theocratic organization around a lineage of Celestial Masters and its focus on the use of talismans and specific rituals. It sees harmonisation with the Dao, which is the ultimate goal of existence, as deriving not only through internal activities but external alignment with benevolent deities."
 musok_aspect: "Musok"
 musok_aspect_desc: "Musok is a shamanistic polytheistic practice present in Korea, which revolves around the use of rituals by shamans as a means of engaging with and seeking the blessing of deities and ancestral spirits."
 tin_nguong_dan_gian: "Tín Ngưỡng Dân Gian"
 tin_nguong_dan_gian_desc: "Tín Ngưỡng Dân Gian refers to the folk polytheistic faith present in Vietnam. Specific manifestations of this faith include worship of mother-goddesses, and the idea of linh as a divine energy that sets boundaries, connects aspects of the world and creates." 
 honji_suijaku: "Honji Suijaku"
 honji_suijaku_desc: "Honji Suijaku refers to the idea that buddhas choose to appear in Japan as native kami, seeing the kami, thus, as sometimes lesser or equal aspects of buddhas."
 inverted_honji_suijaku: "Han Honji Suijaku"
 inverted_honji_suijaku_desc: "Han Honji Suijaku, or Inverted Honji Suijaku, refers to the idea that the native kami of Japan are the original essences and seeds of buddhas, with buddhas thus being lesser manifestations of kami."
 yoshida_shinto: "Yoshida Shintō"
 yoshida_shinto_desc: "Yoshida Shintō is a sect arising from the teachings of Yoshida Kanetomo, which provides further structure to the idea of Han Honji Suijaku and seeks to organize Shintō coherently. It argues Shintō is the true primal religion from which all principles derive."
 fukko_shinto: "Fukko Shintō"
 fukko_shinto_desc: "Fukko Shintō is a sect within Shintō which seeks to reject Buddhist and Confucian influence and reemphasises a pure form of the faith. It puts emphasis on the kannagara no michi, the teachings of the gods that have been passed down through time, rather than Buddhist or Confucian perspectives."
 
 SECT_PERFECT_TEACHING_NAME: "Perfect Teaching"
 SECT_SOGATAN_NAME: "Sogatan"
 
 perfect_teaching_policy: "Perfect Teaching"
 perfect_teaching_policy_desc: "Perfect Teaching is a sect of Buddhism that took shape in the territories of the Liao dynasty. It combines tantric practices with elements of Huayan Buddhism, Chan Buddhism and Samantabhadra. The school argues that since all Buddhist teachings originate from the 'one-mind', they can be organized into a comprehensive system accommodating all ‘practical’ dimensions."
 sogatan_policy: "Sogatan"
 sogatan_policy_desc: "Sogatan is an Old Javanese term for Buddhist. It refers to the form of esoteric Buddhism that took shape in Indonesia alongside Hinduism."
 
 arianism: "Arianism"
 arianism_desc: "We reject the traditional Trinity of equal parts, instead seeing Christ, who pre-existed as the Logos, as another of God's creations. As such, though Christ is divine and pre-existed, he is not an equal to God the Father."
 nonadorantism: "Nonadorantism"
 nonadorantism_desc: "We reject the holy Trinity and the pre-existence of Christ, and see Christ as only a man with a messianic purpose, conceived as a man through either a virgin or non-virgin birth. As only a human, Christ is not to be worshipped or adored, and all prayer must be exclusively directed to the one God."
 absolute_pacifism: "Absolute Pacifism"
 absolute_pacifism_desc: "Blessed are the peacemakers. One's commitment to peace should be absolute, and service or action even in just war is inexcusable."
 community_of_goods: "Community of Goods"
 community_of_goods_desc: "'All the believers were together and had everything in common. They sold property and possessions to give to anyone who had need'. Our Christian communities shall own all things collectively and distribute them based on need rather than profit."
 limited_divine_knowledge: "Divine Nescience"
 limited_divine_knowledge_desc: "God's omniscience is restricted only to the certain truths that will definitely happen in the future. Events and situations that are products of human choice and free will are unknown to Him."
 
 icd_abrahamic_marriage: "Biblical Polygamy"
 icd_abrahamic_marriage_desc: "The Bible condones the practice of polygamy, it is not our role to deny such an ancient right."
 icd_anabaptist_polygamy: "Biblical Polygamy"
 icd_anabaptist_polygamy_desc: "The Bible condones the practice of polygamy, it is not our role to deny such an ancient right."
 icd_teetotalism: "Teetotalism"
 icd_teetotalism_desc: "The consumption of alcohol is to be strictly forbidden"
 icd_godhead: "Membership in the Godhead"
 icd_godhead_desc: "Every true Christian is a member of the Trinitarian Godhead, and shares in God's grace and love."
 icd_celestial_flesh: "Celestial Flesh"
 icd_celestial_flesh_desc: "Jesus did not have physical flesh formed from the Virgin Mary, but instead his human body was brought down directly from heaven"
 
 REFORMATION_HAS_ANABAPTIST_MOVEMENT: "[ShowReligionName('anabaptist')] movement active (Anabaptism spreading)"
 
 sola_scriptura: "Pietas Litterata"
 sola_scriptura_desc: "It is the duty of every Protestant state to educate the young, so that through education they may attain greater learned devotion to Christ."
 sola_fide: "Two Kingdoms"
 sola_fide_desc: "God has therefore ordained two regiments- the spiritual which by the Holy Spirit produces Christians and pious folk under Christ, and the secular which restrains un-Christian and evil folk, so that they are obliged to keep outward peace."
 
  
 icd_seven_sacraments: "Seven Sacraments"
 icd_seven_sacraments_desc: "We will embrace the seven sacraments in their entirety, treating all seven as full sacraments rather than simply sacramental rites."
 icd_great_peasant_rebellion: "Icd great peasant rebellion"
 icd_great_peasant_rebellion_country: "Icd great peasant rebellion country"
 icd_great_peasant_rebellion_country_adjective: "Icd great peasant rebellion country adjective"

 nizari_religion: "Nizarism"
 nizari_religion_ADJ: "Nizari"
 nizari_religion_desc: "Nizarism is a denomination of Isma'ilism, itself a sect in Shiism. Nizaris believe that the prophet Muhammad appointed his son-in-law 'Alī ibn Abī Ṭālib as the 'Imam', the spiritual guide of Muslims and the intercessor between humans and God. Nizaris believe that the position of Imam has been inherited by 'Alī's descendants, but unlike other Shiites, they recognise only descendants through Isma'il ibn Ja'far's lineage and through Nizar ibn al-Mustansir's lineage, up to the present day. They see the role of Imam as requiring a living individual, who should be loved and respected by the Muslim community for his authority and role in providing religious interpretation."
 mustali_religion: "Musta'lism"
 mustali_religion_ADJ: "Musta'li"
 mustali_religion_desc: "Musta'lism is a denomination of Isma'ilism, itself a sect in Shiism. Musta'lis believe that the prophet Muhammad appointed his son-in-law 'Alī ibn Abī Ṭālib as his successor and the 'Imam', the spiritual guide of Muslims and the intercessor between humans and God. Musta'lis believe that the position of Imam has been inherited by 'Alī's descendants, but unlike other Shiites, they recognise only descendants through Isma'il ibn Ja'far's lineage and through al-Mustaʿlī Aḥmad ibn al-Mustanṣir's lineage. After the death of Imam and Fatimid Caliph al-Amir bi-Ahkam Allah, Musta'lis believe that his true successor al-Ṭayyib ibn al-Āmir was rescued from Cairo through divine intervention and entered a period of concealment to avoid persecution, where he and his descendants have remained since then. For the Musta'li, while in concealment, the Imams are to be represented by a regent, the Da'i al-Mutlaq ('absolute missionary'), who serves as their community's chief authority until the End Times come about."
 zaydi_religion: "Zaydisim"
 zaydi_religion_ADJ: "Zaydi"
 zaydi_religion_desc: "Zaydism is a denomination in Shiism, that maintains that the prophet Muhammad appointed his son-in-law 'Alī ibn Abī Ṭālib as his successor and the 'Imam', the spiritual and political leadership of Muslims. Unlike other Shiites, Zaydis believe that though the descendants of 'Alī had a priority to claim the position of Imam, the position can go to other worthy candidates outside of the chosen lineage. They believe that Zayd ibn Ali was the rightful Imam after the death of the fourth Imam, Ali ibn al-Husayn al-Sajjad, and that his position was granted not necessarily due to his birth right, but for his righteous rebellion against the tyranny of the Umayyad Caliphate. Zaydis typically see acts of rebellion against tyranny, and acts of merit as being the true legitimising factors in deciding the position of Imam. In theology, they borrow heavily from both Sunni and Shia perspectives, and use rationalist approaches to understanding scripture."
 
 
 wahbi_school: "Wahbi"
 azzabas_school: "Azzabas"
 usuli_school: "Usuli"
 akhbari_school: "Akhbari"
 wahbi_school_desc: "The Wahbi school is the dominant school of thought in Ibadism. It stresses the importance of ijtihad, or independent reasoning, and rejects taqlid or deference, in determining jurisprudence. It hold that Ibadi believers are allowed to follow incorrect opinions derived through ijtihad as long as they believe it to be true after having made an effort to arrive at the correct opinion"
 azzabas_school_desc: "The Azzabas school is a minoritarian school of thought in Ibadism. It took shape in the Maghreb during the 13th century, placing great focus on the Council of ʿAzzāba as a means of determining correct jurisprudence."
 usuli_school_desc: "The Usuli school is a school of thought in Ja'fari jurisprudence. As the infallible source of understanding the Quran, the Hidden Imam, is in occultation, Usulism argues in favor of the use of ijtihad (reasoning) in the creation of new rules of jurisprudence and emphasises the role that mujtahid (experts in Islamic independent reasoning) have in being able to correctly determine jurisprudence. Usulism sees it as obligatory to obey a mujtahid in determining righteous behaviour and policy."
 akhbari_school_desc: "The Akhbari school is a school of thought in Ja'fari jurisprudence. Akhbaris reject the authority of experts of jurisprudence and forbid the use of independent reasoning in determining new rules. They emphasise that only the Twelve Imams, the prophet Muhammad and his daughter Fatima, have the authority and infallibility to determine religious law, and thus that a literalist understanding of the Qur'an and accepted hadiths is the only legitimate source of authority."
 hadawi_school: "Hadawi"
 hadawi_school_desc: "The Hadawi school is a school of thought in Zaydism, which took shape based on the works of Al-Hadi ila'l-Haqq Yahya of Yemen. It originated in the 9th century in Yemen and was strongly influenced by the Mu'tazila rationalist theological position. The school stresses the importance of the use of reason in determining jurisprudence."
 nasiri_school: "Nasiri"
 nasiri_school_desc: "The Nasiri school is a school of thought in Zaydism, which took shape based on the example of Hasan al-Utrush of Tabaristan. It developed around the Caspian Sea in the 10th century, and has a distinct theological outlook."
 satpanth_school: "Satpanth"
 satpanth_school_desc: "The Satpanth school is practically a separate sect of Isma'ilism, taking shape in Punjab under the influence of Pir Sadardin and his Satpanth movement. It bases its teachings on law and belief faround the idea of tolerance and perennialism, with a strong syncretism between Hinduism and Islam."
 
